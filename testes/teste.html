<!doctype html><meta charset="utf-8"><title>teste</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}pre{position:absolute;left:-9999px}</style>
<iframe id="f" src="../index.html"></iframe><pre id="out">PENDENTE</pre>
<script>
// Joga o quiz de verdade dentro do iframe, clicando nos botões da página.
const P = new URLSearchParams(location.search);
const acao = P.get("acao") || "completo", largura = P.get("largura");
const f = document.getElementById("f"), log = [];
let fase = 1; // a ação "etapa" recarrega a página do jogo para conferir que o progresso ficou guardado
// O perfil do navegador é o mesmo entre as execuções do roteiro: cada uma começa sem progresso guardado
try { localStorage.removeItem("quiz-santos-progresso"); } catch (e) {}
if (largura) f.style.width = largura + "px";
const altura = P.get("altura");
if (altura) f.style.height = altura + "px";
f.onload = () => {
  const w = f.contentWindow, d = f.contentDocument, erros = [], Q = w.__quiz;
  w.addEventListener("error", e => erros.push(e.message));
  const q = s => d.querySelector(s), qa = s => [...d.querySelectorAll(s)];
  const sexoPorNome = Object.fromEntries(Q.SAINTS.map(s => [s.name, s.sex]));
  const nomeDe = o => o.querySelector("span:last-child").textContent;

  function jogar(modo, nivel, teclado, pararEm) {
    d.getElementById("modo-" + modo).click();
    d.getElementById("lvl-" + nivel).click();
    const vistos = new Set(), prob = [];
    for (let r = 0; r < 10; r++) {
      const opts = qa(".opt"), st = Q.state(), ans = st.order[st.i];
      if (opts.length !== 4 || new Set(opts.map(nomeDe)).size !== 4) prob.push(`rodada ${r + 1}: opções erradas`);
      if (q("#round").textContent !== String(r + 1)) prob.push(`rodada ${r + 1}: contador mostra ${q("#round").textContent}`);
      const pic = q("#art img, #art svg");
      const esperaImg = !!Q.imgFor(ans, modo);
      if (!pic) prob.push(`rodada ${r + 1}: quadro vazio`);
      else if ((pic.tagName === "IMG") !== esperaImg) prob.push(`rodada ${r + 1}: quadro deveria ser ${esperaImg ? "imagem" : "desenho"}`);
      if (modo === "imagem" && new Set(opts.map(o => sexoPorNome[nomeDe(o)])).size !== 1) prob.push(`rodada ${r + 1}: opções de sexos diferentes`);
      const pergunta = q(".q").textContent;
      if (pergunta !== (modo === "imagem" ? "Que santo é este?" : "Que santo é representado por estes símbolos?")) prob.push(`rodada ${r + 1}: pergunta errada`);
      if (pararEm === "pergunta" && r === 2) return;
      const k = r % 4;
      if (teclado) d.dispatchEvent(new w.KeyboardEvent("keydown", { key: String(k + 1), bubbles: true }));
      else opts[k].click();
      const certa = q(".opt.ok"), nome = q(".name");
      if (!certa || !nome) { prob.push(`rodada ${r + 1}: resposta não revelada`); break; }
      if (nomeDe(certa) !== nome.textContent) prob.push(`rodada ${r + 1}: nome revelado difere da opção certa`);
      if (!q(".feast").textContent || q(".why").textContent.length < 30) prob.push(`rodada ${r + 1}: festa ou explicação vazia`);
      if (vistos.has(nome.textContent)) prob.push(`rodada ${r + 1}: santo repetido`);
      vistos.add(nome.textContent);
      if (pararEm === "resposta" && r === 2) return;
      q("#next").click();
    }
    const nota = q(".big") ? q(".big").textContent : "sem tela final";
    const verdes = qa(".dot.ok").length, vermelhas = qa(".dot.bad").length, rever = qa(".missed li").length;
    if (nota !== `${verdes}/10`) prob.push(`nota ${nota} não bate com ${verdes} bolinhas verdes`);
    if (rever !== vermelhas) prob.push(`"Para rever" tem ${rever} itens e houve ${vermelhas} erros`);
    log.push(`${modo}/${nivel} (${teclado ? "teclado" : "clique"}): nota ${nota}; problemas: ${prob.length ? prob.join("; ") : "nenhum"}`);
  }

  const visivel = id => !d.getElementById(id).hidden;
  const esperar = (cond, ms = 3000) => new Promise(ok => { const t0 = Date.now(); (function ver() { if (cond() || Date.now() - t0 > ms) ok(!!cond()); else setTimeout(ver, 30); })(); });

  // Joga a etapa 1 do mapa errando o primeiro santo, e confere a navegação com os botões da página e com o voltar do navegador
  async function etapa() {
    const prob = [], col = Q.COLECOES[0], ets = Q.etapas(col), total = Q.itensDe(col).length;
    if (!visivel("inicio") || visivel("stage") || visivel("mapa")) prob.push("a primeira tela não é o início");
    if (!q("#col-santos") || !q("#livre")) prob.push("faltam a carta dos santos ou o botão de jogo livre");
    q("#col-santos").click();
    const casas = qa(".casa");
    if (!visivel("mapa") || casas.length !== ets.length) prob.push(`o mapa deveria ter ${ets.length} etapas, tem ${casas.length}`);
    if (!casas[0].classList.contains("aberta") || !casas.slice(1).every(c => c.classList.contains("trancada") && c.disabled)) prob.push("sem progresso, só a etapa 1 deveria estar aberta");
    if (casas.some(c => c.getBoundingClientRect().left < 0 || c.getBoundingClientRect().right > w.innerWidth)) prob.push("há etapa cortada pela borda da tela");
    casas[1].click();
    if (!visivel("mapa")) prob.push("etapa trancada abriu");
    casas[0].click();
    if (!visivel("stage") || qa(".opt").length !== 4 || q("#lvl-facil")) prob.push("a etapa não abriu como jogo, ou mostrou os botões de nível");
    // Com o mapa na tela, as teclas 1 a 4 não podem responder a partida escondida
    q("#voltar").click();
    if (!await esperar(() => visivel("mapa"))) prob.push("o botão Mapa não voltou ao mapa");
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "1", bubbles: true }));
    if (Q.state().picked) prob.push("a tecla 1 respondeu a rodada com o mapa na tela");
    q("#etapa-1").click();
    const errado = Q.state().order[0];
    let voltas = 0, reviu = false;
    for (; voltas < 40 && !q("#vermapa"); voltas++) {
      const st = Q.state(), ans = st.order[st.i], opts = qa(".opt");
      if (!opts.every(o => ets[0].includes(o.dataset.id))) prob.push(`resposta ${voltas + 1}: há opção de fora da etapa 1`);
      if (voltas > 0 && ans === errado) reviu = true;
      opts.find(o => voltas === 0 ? o.dataset.id !== ans : o.dataset.id === ans).click();
      q("#next").click();
    }
    if (voltas !== 11 || !reviu) prob.push(`errando um santo, a etapa deveria fechar em 11 respostas com ele de volta; foram ${voltas}`);
    if (!/Etapa 1 completa/.test(q(".end .eyebrow")?.textContent || "") || qa(".missed li").length !== 1) prob.push("a tela final não diz que a etapa fechou, ou não lista o santo errado");
    if (qa(".dot.ok").length !== 10) prob.push(`deveria haver 10 bolinhas acesas, há ${qa(".dot.ok").length}`);
    q("#proxima")?.click();
    if (Q.state().etapa !== 1 || qa(".opt").length !== 4) prob.push("Próxima etapa não abriu a etapa 2");
    // Voltar do aparelho, no meio da etapa: mostra o mapa; de novo: mostra o início
    w.history.back();
    if (!await esperar(() => visivel("mapa"))) prob.push("o voltar do navegador, no meio da etapa, não mostrou o mapa");
    if (!q("#etapa-1")?.classList.contains("completa") || !q("#etapa-2")?.classList.contains("aberta") || !q("#etapa-3")?.classList.contains("trancada")) prob.push("depois da etapa 1, o mapa deveria mostrar 1 completa, 2 aberta e 3 trancada");
    w.history.back();
    if (!await esperar(() => visivel("inicio"))) prob.push("o voltar do navegador, no mapa, não mostrou o início");
    if (!q("#col-santos").textContent.includes(`10 de ${total}`)) prob.push(`a carta dos santos deveria dizer 10 de ${total}: ${q("#col-santos").textContent}`);
    log.push(`etapa do mapa: problemas: ${prob.length ? prob.join("; ") : "nenhum"}`);
  }

  // Segunda fase da ação "etapa": a página do jogo foi recarregada e o progresso tem de estar lá
  function depoisDeRecarregar() {
    const prob = [], total = Q.itensDe(Q.COLECOES[0]).length;
    if (!visivel("inicio") || !q("#col-santos").textContent.includes(`10 de ${total}`)) prob.push("depois de recarregar, o início não mostra 10 acertos");
    q("#col-santos").click();
    if (!q("#etapa-1")?.classList.contains("completa") || !q("#etapa-2")?.classList.contains("aberta")) prob.push("depois de recarregar, o mapa perdeu a etapa 1");
    log.push(`mapa depois de recarregar: problemas: ${prob.length ? prob.join("; ") : "nenhum"}`);
  }

  // Foco de revisão 4: imagem que não carrega cai para o desenho e a rodada continua respondível.
  // Lista todos os santos como tendo imagem, troca o endereço por um que não existe e espera o erro de carga de verdade.
  async function falhaDeImagem() {
    const antes = Q.COM_SIMBOLOS.slice();
    Q.COM_SIMBOLOS.push(...Q.SAINTS.map(s => s.id).filter(id => !antes.includes(id)));
    d.getElementById("modo-simbolos").click();
    const img = q("#art img");
    if (img) {
      await new Promise(ok => { img.addEventListener("error", ok, { once: true }); img.src = "img/nao-existe.webp"; setTimeout(ok, 3000); });
      await new Promise(ok => setTimeout(ok, 50));
    }
    const caiu = !!img && !!q("#art svg") && !q("#art img");
    Q.COM_SIMBOLOS.length = 0; Q.COM_SIMBOLOS.push(...antes);
    qa(".opt")[0].click();
    log.push(`falha de imagem: problemas: ${caiu && q(".name") ? "nenhum" : "o quadro não caiu para o desenho ou a rodada travou"}`);
  }

  // Erro de imagem que chega atrasado, depois de a rodada avançar, não pode trocar o quadro da rodada nova
  function falhaAtrasada() {
    d.getElementById("modo-simbolos").click();
    const velha = q("#art img");
    qa(".opt")[0].click(); q("#next").click();
    const st = Q.state(), esperado = Q.imgFor(st.order[st.i], "simbolos");
    if (velha) velha.dispatchEvent(new w.Event("error"));
    const atual = q("#art img");
    const ok = !!velha && !!atual && atual.getAttribute("src") === esperado && !q("#art svg");
    log.push(`falha atrasada de imagem: problemas: ${ok ? "nenhum" : "o quadro da rodada nova foi trocado pelo desenho da rodada anterior"}`);
  }

  // No celular, ao avançar de rodada, o quadro e as 4 opções precisam caber na tela sem rolar
  function cabeNaTela() {
    d.getElementById("modo-imagem").click();
    d.getElementById("lvl-todos").click();
    const prob = [];
    for (let r = 0; r < 3; r++) {
      qa(".opt")[0].click(); q("#next").click();
      const art = q("#art").getBoundingClientRect(), ult = qa(".opt")[3].getBoundingClientRect();
      if (art.top < -1) prob.push(`rodada ${r + 2}: o quadro começa ${Math.round(-art.top)} px acima da tela`);
      if (ult.bottom > w.innerHeight + 1) prob.push(`rodada ${r + 2}: a última opção termina ${Math.round(ult.bottom - w.innerHeight)} px abaixo da tela`);
      // Em celular alto de pé, o vitral tem de aproveitar a largura: pouco espaço vazio dos lados
      if (w.innerWidth <= 720 && w.innerHeight >= 800 && art.width < 0.8 * w.innerWidth) prob.push(`rodada ${r + 2}: o vitral ocupa só ${Math.round(100 * art.width / w.innerWidth)}% da largura da tela`);
      // Em qualquer tela, o vitral inteiro tem de caber na altura
      if (art.bottom > w.innerHeight + 1) prob.push(`rodada ${r + 2}: o vitral termina ${Math.round(art.bottom - w.innerHeight)} px abaixo da tela`);
    }
    log.push(`cabe na tela ${w.innerWidth}x${w.innerHeight}: problemas: ${prob.length ? prob.join("; ") : "nenhum"}`);
  }

  (async () => {
    try {
      // A página abre no início. Os testes do jogo de 10 rodadas entram pelo botão "Jogo livre".
      if (!["etapa", "mapa", "inicio-mapa"].includes(acao)) d.getElementById("livre").click();
      if (acao === "etapa" && fase === 1) {
        await etapa();
        if (erros.length) log.push(`erros de script antes de recarregar: problemas: ${erros.join(" | ")}`);
        fase = 2; w.location.reload();
        return;
      }
      if (acao === "etapa") depoisDeRecarregar();
      else if (acao === "inicio-mapa") { /* só abre a página, para fotografar a tela inicial */ }
      else if (acao === "mapa") {
        // Para a foto: 34 santos acertados (3 etapas completas e a quarta pela metade) e o mapa aberto
        Q.ORDEM.slice(0, 34).forEach(id => Q.marcarAcerto(Q.COLECOES[0], id));
        q("#col-santos").click();
      }
      else if (acao === "completo") {
        let t = false;
        for (const modo of ["simbolos", "imagem"]) for (const nivel of ["facil", "medio", "dificil", "todos"]) jogar(modo, nivel, t = !t);
        q("#again").click();
        log.push(`jogar de novo: problemas: ${q("#round").textContent === "1" && q("#hits").textContent === "0" && qa(".opt").length === 4 ? "nenhum" : "não zerou"}`);
        await falhaDeImagem();
        falhaAtrasada();
      } else if (acao === "cabe") cabeNaTela();
      else if (acao === "inicio") { /* só abre a página, para fotografar a primeira tela */ }
      else jogar(P.get("modo") || "simbolos", P.get("nivel") || "todos", false, acao);
      if (largura) log.push(`largura ${largura}: problemas: ${d.documentElement.scrollWidth > d.documentElement.clientWidth ? "a página rola para o lado" : "nenhum"}`);
    } catch (e) { log.push("EXCECAO: " + e.message); }
    log.push(`erros de script: problemas: ${erros.length ? erros.join(" | ") : "nenhum"}`);
    document.getElementById("out").textContent = "RESULTADO\n" + log.join("\n") + "\nFIM";
  })();
};
</script>
