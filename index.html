  // ---------- Window ----------
  function rand(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
  // Irregular glass pieces: a Voronoi diagram of jittered seeds, corners rounded so the lead reads as hand-cut came
  function clipHalf(poly, p, q) {
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, dx = q[0] - p[0], dy = q[1] - p[1];
    const side = v => (v[0] - mx) * dx + (v[1] - my) * dy;
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const A = poly[i], B = poly[(i + 1) % poly.length], sa = side(A), sb = side(B);
      if (sa <= 0) out.push(A);
      if ((sa <= 0) !== (sb <= 0)) { const t = sa / (sa - sb); out.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); }
    }
    return out;
  }
  function cells(seeds, box) {
    return seeds.map((p, i) => {
      let poly = box;
      for (let j = 0; j < seeds.length && poly.length; j++) {
        if (j === i) continue;
        const q = seeds[j];
        if (Math.abs(q[0] - p[0]) > 90 || Math.abs(q[1] - p[1]) > 90) continue;
        poly = clipHalf(poly, p, q);
      }
      return { seed: p, poly };
    }).filter(c => c.poly.length > 2);
  }
  function smooth(poly, it = 2) {
    for (let k = 0; k < it; k++) {
      const o = [];
      for (let i = 0; i < poly.length; i++) {
        const A = poly[i], B = poly[(i + 1) % poly.length];
        o.push([A[0] * .75 + B[0] * .25, A[1] * .75 + B[1] * .25], [A[0] * .25 + B[0] * .75, A[1] * .25 + B[1] * .75]);
      }
      poly = o;
    }
    return "M" + poly.map(v => v[0].toFixed(1) + "," + v[1].toFixed(1)).join("L") + "Z";
  }
  function jitterSeeds(r, x0, y0, x1, y1, step, keep) {
    const out = [];
    for (let y = y0; y <= y1; y += step * .87) for (let x = x0 + ((Math.round((y - y0) / (step * .87)) % 2) ? step / 2 : 0); x <= x1; x += step) {
      const p = [x + (r() - .5) * step * .7, y + (r() - .5) * step * .7];
      if (!keep || keep(p)) out.push(p);
    }
    return out;
  }

  function windowSVG(saint) {
    const h = saint.hue, r = rand(h * 7 + 11), id = saint.id;
    const acc = (h + 180) % 360, CX = 150, CY = 235, R = 112;
    const arch = "M20,392 L20,150 A130,130 0 0 1 280,150 L280,392 Z";
    const inner = "M37,392 L37,150 A113,113 0 0 1 263,150 L263,392";
    const dist = (p, x, y) => Math.hypot(p[0] - x, p[1] - y);
    // distance from a point to the arch outline (approximate: sides, top arc)
    const toEdge = p => Math.min(p[0] - 20, 280 - p[0], 392 - p[1] + 99, p[1] < 150 ? 130 - dist(p, 150, 150) : 999);

    // Outer field
    let outer = "";
    cells(jitterSeeds(r, 4, 4, 296, 406, 27), [[0, 0], [300, 0], [300, 410], [0, 410]]).forEach(c => {
      const p = c.seed, dm = dist(p, CX, CY), t = r();
      let fill;
      if (toEdge(p) < 17) fill = (Math.floor(p[0] / 9 + p[1] / 9) % 3 === 0) ? `hsl(44,80%,${50 + Math.floor(r() * 10)}%)` : `hsl(${acc},${55 + Math.floor(r() * 15)}%,${30 + Math.floor(r() * 12)}%)`;
      else if (dm < R + 16) fill = `hsl(${44 + Math.floor(r() * 10)},${72 + Math.floor(r() * 14)}%,${48 + Math.floor(r() * 14)}%)`;
      else if (t > .92) fill = `hsl(${acc},60%,${34 + Math.floor(r() * 14)}%)`;
      else fill = `hsl(${h + Math.floor(r() * 20) - 10},${48 + Math.floor(r() * 24)}%,${20 + Math.floor(r() * 22)}%)`;
      outer += `<path d="${smooth(c.poly)}" fill="${fill}"/>`;
    });
    // Medallion field: light glass so the symbols read
    let med = "";
    cells(jitterSeeds(r, CX - R, CY - R, CX + R, CY + R, 42, p => dist(p, CX, CY) < R + 26), [[CX - R - 4, CY - R - 4], [CX + R + 4, CY - R - 4], [CX + R + 4, CY + R + 4], [CX - R - 4, CY + R + 4]]).forEach(c => {
      const d = dist(c.seed, CX, CY) / R;
      med += `<path d="${smooth(c.poly)}" fill="hsl(${h + Math.floor(r() * 24) - 12},${36 + Math.floor(r() * 18)}%,${Math.round(88 - d * 14 - r() * 8)}%)"/>`;
    });

    const noise = (fid, freq, seed, k1, k2) => `
      <filter id="${fid}" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="4" seed="${seed}"/>
        <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="n"/>
        <feComposite in="SourceGraphic" in2="n" operator="arithmetic" k1="${k1}" k2="${k2}" k3="0" k4="0" result="m"/>
        <feComposite in="m" in2="SourceGraphic" operator="in"/>
      </filter>`;
    return `<svg viewBox="0 0 300 410" role="img" aria-label="Vitral com símbolos de um santo" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="cp-${id}"><path d="${arch}"/></clipPath>
        <clipPath id="cm-${id}"><circle cx="${CX}" cy="${CY}" r="${R}"/></clipPath>
        ${noise("mot-" + id, 0.045, h % 97, 1.1, 0.55)}
        <filter id="fig-${id}" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
          <feGaussianBlur stdDeviation="4"/><feOffset dx="2.5" dy="3.5" result="sh"/>
          <feFlood flood-color="#3a2410" flood-opacity=".6"/><feComposite in2="sh" operator="in"/>
          <feComposite in2="SourceAlpha" operator="in" result="inner"/>
          <feMerge result="shaded"><feMergeNode in="SourceGraphic"/><feMergeNode in="inner"/></feMerge>
          <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="${(h * 3) % 89}"/>
          <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0 1" result="n"/>
          <feComposite in="shaded" in2="n" operator="arithmetic" k1="0.7" k2="0.72" k3="0" k4="0" result="m"/>
          <feComposite in="m" in2="SourceGraphic" operator="in"/>
        </filter>
        <radialGradient id="lt-${id}" cx="38%" cy="22%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".30"/></radialGradient>
        <linearGradient id="ray-${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".13"/><stop offset=".55" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <g clip-path="url(#cp-${id})">
        <rect x="0" y="0" width="300" height="410" fill="${L}"/>
        <g filter="url(#mot-${id})" stroke="${L}" stroke-width="2.6" stroke-linejoin="round">${outer}</g>
        <g clip-path="url(#cm-${id})">
          <circle cx="${CX}" cy="${CY}" r="${R}" fill="${L}"/>
          <g filter="url(#mot-${id})" stroke="${L}" stroke-width="1.5" stroke-linejoin="round">${med}</g>
        </g>
        <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${L}" stroke-width="5.5"/>
        <path d="${inner}" fill="none" stroke="${L}" stroke-width="4"/>
        <g filter="url(#fig-${id})"><g stroke="${L}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${saint.draw ? saint.draw() : ""}</g></g>
        <rect x="0" y="0" width="300" height="410" fill="url(#lt-${id})"/>
        <rect x="0" y="0" width="300" height="410" fill="url(#ray-${id})"/>
      </g>
      <path d="${arch}" fill="none" stroke="#3b302a" stroke-width="13" stroke-linejoin="round"/>
      <path d="${arch}" fill="none" stroke="#6e6258" stroke-width="3" stroke-linejoin="round" transform="translate(-1.5,-1.5)" opacity=".7"/>
      <rect x="8" y="389" width="284" height="17" rx="3" fill="#7a6b5d" stroke="${L}" stroke-width="3"/>
      <rect x="12" y="392" width="276" height="4" rx="2" fill="#a3937f" stroke="none"/>
    </svg>`;
  }

  // ---------- Game ----------
  const ROUNDS = 10;
  const EASY = "pedro paulo francisco jorge teresinha antonio sebastiao luzia jose miguel barbara joao clara rita judas cristovao expedito nicolau pio cosme edwiges teresacalcuta joaopaulo bento madalena ana monica veronica dulce margaridamaria gabriel reismagos joaobosco carloacutis vicentepaulo ines pastorinhos tome valentim silvestre pancracio geraldo catarinalaboure joaoxxiii domingossavio mariagoretti lazaro piox luisrei paulovi anjodaguarda".split(" ");
  const HARD = "ambrosio gregorio apolonia rosalima xavier antao kolbe ferrer bakhita eloi huberto goncalo isidoro bartolomeu barnabe rafael brigida escolastica doroteia edithstein filipe tiagomenor joaodedeus januario bonifacio nepomuceno frassati charbel cupertino foucauld inacioantioquia tomasbecket brandao amaro ivo germano ezequielmoreno tomasvilanova joaosahagun nicolautolentino madalenanagasaki simao matias gil vito roquegonzalez kateri junipero fiacre venceslau clemente perpetua basilio leao anselmo beda norberto kostka angelamerici lwanga cirilometodio solano mariaegipciaca hildegarda cabrini dimpna albertomagno nuno joaodebrito erasmo raimundopenaforte borja".split(" ");
  const levelOf = id => EASY.includes(id) ? "facil" : HARD.includes(id) ? "dificil" : "medio";
  // Resumo da vida de cada santo, gerado por ferramentas/bios.py
  const BIO = {"pedro": "Pescador da Galileia, chamado por Jesus para ser o primeiro dos apóstolos. Foi o primeiro papa e morreu mártir em Roma, entre os anos 64 e 68, crucificado de cabeça para baixo.", "paulo": "Fariseu de Tarso que perseguia os cristãos, converteu-se no caminho de Damasco. Tornou-se o grande missionário dos povos não judeus e morreu mártir em Roma, entre os anos 64 e 67.", "francisco": "Filho de um rico comerciante de Assis, na Itália, largou tudo para viver o Evangelho na pobreza. Fundou a Ordem Franciscana e morreu em 1226.", "jorge": "Soldado romano nascido na Capadócia, morto por volta de 303 por não renunciar à fé na perseguição de Diocleciano. A lenda do dragão surgiu séculos depois.", "teresinha": "Carmelita francesa que entrou no convento de Lisieux aos 15 anos e morreu de tuberculose aos 24, em 1897. Ensinou a “pequena via” da confiança em Deus e é doutora da Igreja.", "antonio": "Nascido em Lisboa em 1195, tornou-se frade franciscano e um dos maiores pregadores do seu tempo. Morreu em Pádua, na Itália, em 1231.", "sebastiao": "Oficial da guarda do imperador romano, no século III, ajudava em segredo os cristãos presos. Sobreviveu às flechas e foi morto depois a pauladas. É padroeiro do Rio de Janeiro.", "luzia": "Jovem de Siracusa, na Sicília, que consagrou a vida a Deus e distribuiu seus bens aos pobres. Foi martirizada por volta de 304.", "catarina": "Jovem sábia de Alexandria, no Egito, que segundo a tradição venceu em debate os filósofos do imperador. Foi martirizada no início do século IV.", "lourenco": "Diácono de Roma, encarregado dos bens da Igreja e do cuidado dos pobres. Foi martirizado em 258, dias depois do papa Sisto II.", "jose": "Carpinteiro de Nazaré, esposo de Maria e pai adotivo de Jesus. É padroeiro da Igreja, dos trabalhadores e da boa morte.", "miguel": "Um dos três arcanjos citados na Bíblia, chefe dos exércitos celestes. O Apocalipse o mostra vencendo o dragão.", "bento": "Nascido em Núrsia, na Itália, por volta de 480, fundou o mosteiro de Monte Cassino e escreveu a Regra que organizou a vida monástica do Ocidente. É padroeiro da Europa.", "barbara": "Jovem do século III que, segundo a tradição, vivia na Nicomédia e foi morta pelo próprio pai por ter se tornado cristã.", "joao": "Filho de Zacarias e Isabel, parente de Jesus. Pregou a conversão no deserto, batizou Jesus no rio Jordão e foi decapitado por ordem de Herodes.", "clara": "Jovem nobre de Assis que, aos 18 anos, seguiu São Francisco e fundou as Clarissas. Morreu em 1253.", "rita": "Italiana da Úmbria, foi esposa, mãe e viúva antes de entrar para o convento agostiniano de Cássia. Morreu em 1457 e é invocada nas causas impossíveis.", "judas": "Um dos doze apóstolos, a quem se atribui uma carta do Novo Testamento. Segundo a tradição, pregou na Mesopotâmia e na Pérsia, onde morreu mártir.", "cristovao": "Mártir do século III, na Ásia Menor. A tradição o apresenta como um homem de grande estatura que servia a Deus atravessando viajantes num rio.", "expedito": "Segundo a tradição, comandante de uma legião romana, martirizado em Melitene, na Armênia, por volta de 303.", "agostinho": "Nascido em 354 no norte da África, viveu uma juventude inquieta até se converter aos 32 anos, pelas orações da mãe, Santa Mônica. Bispo de Hipona, escreveu as “Confissões”.", "inacio": "Nobre basco ferido em batalha, converteu-se lendo a vida dos santos durante a convalescença. Fundou a Companhia de Jesus em 1540 e morreu em Roma em 1556.", "domingos": "Sacerdote espanhol nascido por volta de 1170, fundou a Ordem dos Pregadores, os dominicanos. Morreu em Bolonha em 1221.", "jeronimo": "Estudioso nascido na Dalmácia por volta de 347, viveu como eremita e depois em Belém, onde morreu em 420. É doutor da Igreja.", "patricio": "Nascido na Britânia, foi levado como escravo para a Irlanda na juventude. Voltou como bispo e evangelizou a ilha no século V.", "nicolau": "Bispo de Mira, na atual Turquia, no século IV, lembrado pela generosidade com os pobres. Suas relíquias estão em Bari, na Itália.", "cecilia": "Jovem romana de família nobre, martirizada por volta do século III. É uma das mártires mais veneradas de Roma.", "apolonia": "Cristã de Alexandria, no Egito, já de idade avançada, morta em 249 num motim contra os cristãos.", "bras": "Médico e bispo de Sebaste, na Armênia, martirizado por volta de 316, depois de viver escondido numa gruta.", "roque": "Nascido em Montpellier, na França, no século XIV, deu seus bens aos pobres e partiu em peregrinação a Roma, cuidando dos doentes de peste pelo caminho.", "tiago": "Pescador, filho de Zebedeu e irmão de João, foi um dos três apóstolos mais próximos de Jesus. Foi o primeiro apóstolo mártir, decapitado em Jerusalém por volta do ano 44.", "mateus": "Cobrador de impostos em Cafarnaum, deixou tudo quando Jesus lhe disse “segue-me”. É apóstolo e autor do primeiro Evangelho.", "marcos": "Discípulo de Pedro e companheiro de Paulo, escreveu o Evangelho mais antigo. A tradição diz que fundou a Igreja de Alexandria, onde morreu mártir.", "lucas": "Médico de origem grega, companheiro de viagem de São Paulo. Escreveu o terceiro Evangelho e os Atos dos Apóstolos.", "joaoev": "Pescador, irmão de Tiago, o apóstolo mais jovem e o “discípulo amado”. Esteve aos pés da cruz e recebeu Maria como mãe.", "andre": "Pescador de Betsaida, irmão de Pedro e discípulo de João Batista. Segundo a tradição, pregou na Grécia, onde foi martirizado.", "estevao": "Um dos sete primeiros diáconos, escolhidos pelos apóstolos para servir os pobres de Jerusalém. Morreu perdoando os que o matavam.", "martinho": "Soldado romano nascido na Panônia em 316 ou 336, deixou o exército para ser monge e depois bispo de Tours, na França.", "ambrosio": "Governador de Milão, foi aclamado bispo pelo povo em 374, antes mesmo de ser batizado. Doutor da Igreja, batizou Santo Agostinho.", "gregorio": "Prefeito de Roma que se fez monge, foi eleito papa em 590. Organizou a liturgia e enviou missionários à Inglaterra. É doutor da Igreja.", "helena": "Mãe do imperador Constantino, converteu-se já idosa. Por volta de 326 viajou à Terra Santa e mandou construir basílicas nos lugares da vida de Jesus.", "pio": "Frade capuchinho italiano, viveu em San Giovanni Rotondo, onde passava horas no confessionário e fundou um hospital. Morreu em 1968.", "joana": "Camponesa francesa que, aos 17 anos, guiada por vozes, liderou o exército da França na Guerra dos Cem Anos. Foi queimada como herege em 1431, aos 19 anos, e reabilitada depois.", "cosme": "Irmãos gêmeos nascidos na Arábia, exerceram a medicina na Ásia Menor e foram martirizados por volta do ano 300.", "edwiges": "Duquesa da Silésia, nascida na Baviera em 1174. Mãe de sete filhos, dedicou-se aos pobres e pagava as dívidas dos presos. Viúva, viveu no mosteiro de Trebnitz.", "rosalima": "Nascida em Lima, no Peru, em 1586, viveu como leiga dominicana na casa dos pais, em oração e no cuidado dos doentes. Morreu aos 31 anos.", "xavier": "Jesuíta espanhol, um dos primeiros companheiros de Santo Inácio. Partiu em 1541 para o Oriente e morreu em 1552, às portas da China. É padroeiro das missões.", "faustina": "Religiosa polonesa de origem humilde, nascida em 1905. Morreu de tuberculose aos 33 anos, em 1938.", "bernadete": "Filha de um moleiro pobre de Lourdes, na França, tinha 14 anos em 1858. Mais tarde entrou para o convento de Nevers, onde morreu em 1879.", "teresaavila": "Carmelita espanhola nascida em 1515, reformou o Carmelo e fundou 17 conventos. Mística e escritora, foi a primeira mulher declarada doutora da Igreja.", "antao": "Egípcio nascido por volta de 251, aos 20 anos deu seus bens aos pobres e retirou-se para o deserto. Morreu com mais de cem anos.", "teresacalcuta": "Nascida em 1910 em Skopje, de família albanesa, foi professora na Índia antes de se dedicar aos moribundos das ruas. Recebeu o Nobel da Paz em 1979 e morreu em 1997.", "kolbe": "Frade franciscano polonês, fundou a Milícia da Imaculada e publicações de grande tiragem. Preso pelos nazistas, morreu em Auschwitz em 1941.", "ferrer": "Dominicano nascido em Valência, na Espanha, em 1350. Trabalhou pelo fim do cisma que dividia a Igreja e morreu na Bretanha em 1419.", "bakhita": "Nascida no Sudão por volta de 1869, foi raptada aos 7 anos e vendida várias vezes. Morreu em 1947, em Schio, na Itália.", "eloi": "Nascido na França por volta de 588, foi conselheiro do rei Dagoberto. Usava a riqueza que ganhava para resgatar escravos.", "huberto": "Nobre da corte franca, nascido por volta de 656 e apaixonado por caçadas. Depois da conversão foi bispo de Maastricht e Liège e evangelizou as Ardenas. Morreu em 727.", "goncalo": "Sacerdote português do século XIII, viveu como eremita e frade dominicano em Amarante, onde construiu uma ponte sobre o rio Tâmega.", "galvao": "Frade franciscano nascido em Guaratinguetá (SP) em 1739. Fundou o Mosteiro da Luz, em São Paulo, e morreu em 1822.", "anchieta": "Jesuíta nascido nas Ilhas Canárias, chegou ao Brasil aos 19 anos, em 1553. Participou da fundação de São Paulo e escreveu a primeira gramática da língua tupi.", "isidoro": "Trabalhador rural nascido em Madri por volta de 1070, casado com Santa Maria de la Cabeza. Passou a vida a serviço do mesmo patrão.", "bartolomeu": "Um dos doze apóstolos. Segundo a tradição, pregou na Índia e na Armênia, onde foi martirizado.", "madalena": "Discípula de Jesus, natural de Magdala, na Galileia. Acompanhou-o até a cruz e foi ao túmulo na manhã de Páscoa.", "barnabe": "Levita nascido em Chipre, vendeu seu campo e entregou o dinheiro aos apóstolos. Apresentou Paulo à comunidade e, segundo a tradição, morreu mártir em Chipre.", "benedito": "Nascido na Sicília em 1526, foi frade franciscano em Palermo. Mesmo sem saber ler, foi escolhido superior do convento. Morreu em 1589.", "longuinho": "Segundo a tradição, o centurião que estava ao pé da cruz e disse: “Verdadeiramente este homem era Filho de Deus”. Teria se convertido e morrido mártir na Capadócia.", "joaopaulo": "Karol Wojtyła, nascido na Polônia em 1920, foi papa de 1978 a 2005. Visitou 129 países, sobreviveu a um atentado em 1981 e criou as Jornadas Mundiais da Juventude.", "rafael": "Um dos três arcanjos citados na Bíblia. É padroeiro dos viajantes, dos médicos e dos farmacêuticos.", "josemaria": "Sacerdote espanhol nascido em Barbastro em 1902. Morreu em Roma em 1975 e foi canonizado em 2002.", "ana": "Segundo uma tradição antiga, esposa de São Joaquim. Os Evangelhos não a mencionam; seu nome vem de escritos do século II.", "monica": "Nascida em Tagaste, no norte da África, por volta de 331. Casada com um pagão de gênio difícil, viu o marido e o filho se converterem. Morreu em Óstia em 387.", "veronica": "Mulher de Jerusalém lembrada pela tradição. Não aparece nos Evangelhos; seu nome é associado à expressão “vera icon”, imagem verdadeira.", "dulce": "Maria Rita Lopes Pontes nasceu em Salvador em 1914 e entrou para a vida religiosa aos 18 anos. Morreu em 1992 e foi canonizada em 2019.", "margaridamaria": "Religiosa francesa da Ordem da Visitação, nascida em 1647. Recebeu as revelações entre 1673 e 1675 e morreu em 1690.", "gabriel": "Um dos três arcanjos citados na Bíblia. Anunciou também a Zacarias o nascimento de João Batista. É padroeiro das comunicações.", "reismagos": "Sábios vindos do Oriente para adorar o Menino Jesus. O Evangelho não diz quantos eram nem que eram reis; a tradição fixou o número três por causa dos presentes.", "joaobosco": "Sacerdote nascido no Piemonte, na Itália, em 1815, de família camponesa. Dedicou a vida aos meninos de rua de Turim e morreu em 1888.", "carloacutis": "Nascido em Londres em 1991 e criado em Milão, era um adolescente comum que ia à missa todos os dias. Morreu de leucemia e foi canonizado em 2025.", "vicentepaulo": "Sacerdote francês nascido em 1581. Fundou a Congregação da Missão e, com Santa Luísa de Marillac, as Filhas da Caridade. Morreu em 1660.", "marta": "Irmã de Maria e de Lázaro, amigos de Jesus. Diante do túmulo do irmão, professou sua fé: “Eu creio que tu és o Cristo”.", "isabel": "Filha do rei da Hungria, nascida em 1207, casou-se com o landgrave da Turíngia. Morreu aos 24 anos, em 1231.", "catarinasena": "Nascida em Siena, na Itália, em 1347, era leiga dominicana e quase não teve estudo. Morreu aos 33 anos; é doutora da Igreja e padroeira da Itália.", "efigenia": "Segundo a tradição, era filha do rei da Etiópia no século I e consagrou-se a Deus, recusando o casamento com o sucessor do pai.", "paulina": "Amabile Visintainer nasceu na Itália em 1865 e veio para o Brasil aos 9 anos, em 1875. Morreu em São Paulo em 1942.", "gianna": "Nascida perto de Milão em 1922, casou-se com Pietro Molla e teve quatro filhos. Foi canonizada em 2004, na presença do marido e dos filhos.", "joaquim": "Segundo uma tradição antiga, esposo de Santa Ana. Os Evangelhos não o mencionam; seu nome vem de escritos do século II.", "luisgonzaga": "Primogênito do marquês de Castiglione, na Itália, nascido em 1568. Entrou na Companhia de Jesus aos 17 anos.", "camilo": "Nascido na Itália em 1550, foi soldado e jogador antes de se converter aos 24 anos. Doente de uma chaga na perna, passou a servir nos hospitais de Roma. Morreu em 1614.", "martinholima": "Nascido em Lima, no Peru, em 1579, filho de um nobre espanhol. Aprendeu o ofício de barbeiro-cirurgião e cuidava de doentes de qualquer origem. Morreu em 1639.", "raimundononato": "Espanhol da Catalunha, nascido por volta de 1204. Chamam-no “Nonato”, não nascido, porque foi tirado do ventre da mãe já morta. Frade mercedário, entregou-se como refém no lugar de cativos.", "vianney": "Camponês francês nascido em 1786, teve grande dificuldade nos estudos. Foi pároco de Ars por 41 anos e atraía multidões. Morreu em 1859.", "tarcisio": "Acólito da Igreja de Roma no tempo das perseguições. O papa São Dâmaso registrou seu martírio num poema.", "joaodiego": "Indígena nascido por volta de 1474, batizado já adulto. Viveu até 1548 junto à capela construída no monte Tepeyac. Foi canonizado em 2002.", "simaostock": "Inglês do século XIII, foi superior geral dos carmelitas quando a ordem se estabelecia na Europa. Morreu em Bordéus, na França.", "dimas": "Um dos dois malfeitores crucificados com Jesus. O nome Dimas vem da tradição; o Evangelho não o cita.", "onofre": "Eremita do Egito, do século IV ou V. Sua história foi contada pelo monge Pafnúcio, que o encontrou no deserto pouco antes da morte.", "tomasaquino": "Nascido perto de Aquino, na Itália, por volta de 1225, de família nobre que se opôs à sua vocação. Ensinou em Paris e morreu em 1274.", "carlosborromeu": "Nascido em 1538, sobrinho de papa, foi cardeal aos 21 anos. Arcebispo de Milão, aplicou as reformas do Concílio de Trento e fundou seminários. Morreu em 1584.", "brigida": "Nascida por volta de 451, fundou o mosteiro de Kildare, um dos mais importantes da Irlanda. Morreu por volta de 525.", "escolastica": "Irmã gêmea de São Bento, nascida em Núrsia por volta de 480. Consagrada a Deus desde jovem, morreu por volta de 543.", "doroteia": "Jovem de Cesareia da Capadócia, martirizada por volta de 311, na perseguição de Diocleciano. É padroeira dos floristas e jardineiros.", "edithstein": "Nascida em Breslávia em 1891, numa família judia, foi discípula do filósofo Husserl. Converteu-se ao ler Santa Teresa d’Ávila e entrou no Carmelo em 1933.", "filipe": "Natural de Betsaida, como Pedro e André, foi um dos primeiros chamados por Jesus e levou Natanael até ele. Segundo a tradição, morreu mártir na Frígia.", "tiagomenor": "Apóstolo, filho de Alfeu. A tradição o identifica com o “irmão do Senhor” que chefiou a Igreja de Jerusalém. Morreu por volta do ano 62.", "joaodedeus": "Português nascido em Montemor-o-Novo em 1495, foi pastor, soldado e livreiro. Converteu-se aos 41 anos e morreu em 1550. Dele nasceu a Ordem Hospitaleira.", "januario": "Bispo de Benevento, na Itália, decapitado por volta de 305, na perseguição de Diocleciano. É padroeiro de Nápoles.", "bonifacio": "Monge inglês nascido por volta de 675, com o nome de Winfrid. Organizou a Igreja na Alemanha e foi morto na Frísia em 754, com quase 80 anos.", "nepomuceno": "Sacerdote nascido na Boêmia por volta de 1345, vigário-geral do arcebispo de Praga. É padroeiro dos confessores e protetor contra as enchentes.", "frassati": "Nascido em Turim em 1901, filho do dono do jornal La Stampa, estudava engenharia de minas. Morreu de poliomielite e foi canonizado em 2025.", "charbel": "Youssef Makhlouf nasceu numa aldeia das montanhas do Líbano em 1828. Monge em Annaya, morreu em 1898. Muitas curas são atribuídas à sua intercessão.", "cupertino": "Nascido em Copertino, no sul da Itália, em 1603, de família muito pobre. Frade franciscano conventual, morreu em 1663.", "foucauld": "Nascido em Estrasburgo em 1858, foi oficial do exército francês e explorador do Marrocos. Convertido aos 28 anos, foi morto em Tamanrasset, na Argélia, em 1916.", "joaodacruz": "Nascido em Fontiveros, na Espanha, em 1542, de família pobre. Chegou a ser preso pelos próprios confrades, e na prisão escreveu seus poemas mais famosos. Morreu em 1591 e é doutor da Igreja.", "inacioantioquia": "Discípulo dos apóstolos e bispo de Antioquia. Preso, escreveu sete cartas a caminho de Roma. Foi o primeiro a usar a expressão “Igreja católica”.", "tomasbecket": "Nascido em Londres por volta de 1120, foi chanceler e amigo do rei. Feito arcebispo, passou a defender a liberdade da Igreja contra ele.", "brandao": "Abade irlandês nascido por volta de 484. Fundou vários mosteiros, entre eles o de Clonfert, e morreu por volta de 577.", "amaro": "Também chamado São Mauro, nasceu em Roma por volta de 512 e foi entregue ainda menino a São Bento. Conta-se que andou sobre as águas para salvar São Plácido.", "ivo": "Nascido na Bretanha, na França, em 1253, estudou direito em Paris e Orléans. Tornou-se padre e morreu em 1303.", "ines": "Menina de família nobre de Roma, recusou os pretendentes por querer pertencer só a Cristo. É uma das santas citadas na oração eucarística da missa.", "pastorinhos": "Irmãos, pastores de Aljustrel, perto de Fátima, viram Nossa Senhora em 1917 com a prima Lúcia. Foram canonizados em 2017 e estão entre os santos mais jovens da Igreja.", "tome": "Um dos doze apóstolos, também chamado Dídimo, que quer dizer gêmeo. Ao ver Jesus ressuscitado, disse: “Meu Senhor e meu Deus!”.", "tomasmore": "Nascido em Londres em 1478, foi advogado, pai de família e autor do livro Utopia. Chegou a chanceler do rei Henrique VIII e foi canonizado em 1935.", "boaventura": "Nascido em Bagnoregio, na Itália, por volta de 1221, estudou e ensinou em Paris. Escreveu a vida de São Francisco e morreu em 1274, durante o Concílio de Lyon.", "bruno": "Nascido em Colônia, na Alemanha, por volta de 1030, foi professor famoso em Reims. Morreu em 1101, num mosteiro que fundou na Calábria, na Itália.", "filipeneri": "Nascido em Florença em 1515, foi para Roma aos 18 anos e ali passou a vida, cuidando de peregrinos, doentes e jovens. Morreu em 1595.", "franciscopaula": "Nascido em Paola, na Calábria, em 1416, retirou-se ainda adolescente para uma gruta. O rei da França mandou chamá-lo, e ele passou seus últimos anos naquele país.", "germano": "Nascido perto de Autun, na França, por volta de 496, foi eremita e abade antes de ser bispo de Paris. Morreu em 576.", "ezequielmoreno": "Nascido em Alfaro, na Espanha, em 1848, entrou para os agostinianos recoletos. Foi canonizado em 1992.", "tomasvilanova": "Nascido na Espanha em 1488, foi frade agostiniano e pregador. Tornou-se arcebispo de Valência em 1545.", "joaosahagun": "Nascido em Sahagún, na Espanha, foi padre e depois frade agostiniano em Salamanca. Morreu em 1479 e foi canonizado em 1690.", "nicolautolentino": "Nascido na Itália por volta de 1245, foi frade agostiniano e viveu cerca de trinta anos em Tolentino. Morreu em 1305 e foi canonizado em 1446.", "madalenanagasaki": "Nascida no Japão por volta de 1611, tornou-se terciária dos agostinianos recoletos. Foi canonizada em 1987, a primeira santa japonesa.", "simao": "Um dos doze apóstolos, chamado também de Cananeu. Os Evangelhos guardam dele apenas o nome.", "matias": "Seguia Jesus desde o batismo no Jordão. Depois da Ascensão, foi escolhido por sorteio para completar o grupo dos doze apóstolos.", "valentim": "Sacerdote de Roma, martirizado por volta de 269, no tempo do imperador Cláudio II. Pouco se sabe com certeza de sua vida, e em 1969 sua festa saiu do calendário geral da Igreja.", "silvestre": "Romano, foi papa de 314 a 335. No seu tempo foram construídas as primeiras grandes basílicas de Roma, como a de São João de Latrão, e reuniu-se o Concílio de Niceia.", "pancracio": "Órfão nascido na Frígia, na atual Turquia, foi levado a Roma por um tio e ali se tornou cristão. Sobre seu túmulo, na Via Aurélia, foi construída uma basílica que leva seu nome.", "geraldo": "Filho de um alfaiate pobre do sul da Itália, nascido em 1726, foi irmão leigo redentorista e trabalhou como alfaiate e porteiro. Morreu de tuberculose aos 29 anos, em 1755.", "catarinalaboure": "Filha de camponeses da Borgonha, nascida em 1806, perdeu a mãe aos 9 anos. Viveu mais de quarenta anos num asilo de idosos em Paris, cuidando dos velhos, e só contou suas visões ao confessor. Morreu em 1876.", "joaoxxiii": "Angelo Roncalli nasceu em 1881 numa família de camponeses perto de Bérgamo, na Itália. Foi diplomata do Vaticano na Bulgária, na Turquia e na França, e papa de 1958 a 1963. Foi canonizado em 2014, junto com João Paulo II.", "domingossavio": "Nascido no Piemonte, na Itália, em 1842, filho de um ferreiro. Morreu de doença em casa, aos 14 anos, em 1857, e é um dos santos não mártires mais jovens da Igreja.", "mariagoretti": "Filha de camponeses pobres, nascida em 1890 em Corinaldo, na Itália. Na sua canonização, em 1950, estavam presentes a mãe e o homem que a matou, já arrependido.", "lazaro": "Amigo de Jesus, morava em Betânia, perto de Jerusalém, com as irmãs Marta e Maria. Segundo uma tradição, foi depois bispo em Chipre; segundo outra, na Provença, na França.", "piox": "Giuseppe Sarto nasceu em 1835 em Riese, perto de Veneza. Foi pároco, bispo e patriarca de Veneza antes de ser papa, de 1903 a 1914. Morreu dias depois do início da Primeira Guerra Mundial.", "luisrei": "Nascido em 1214, tornou-se rei aos 12 anos, sob a regência da mãe, Branca de Castela. Era conhecido pela justiça e pelo cuidado com os pobres, a quem servia pessoalmente à mesa. Foi canonizado em 1297.", "paulovi": "Giovanni Battista Montini nasceu em 1897 perto de Bréscia, na Itália. Foi arcebispo de Milão e papa de 1963 a 1978. Foi canonizado em 2018, no mesmo dia que Santo Óscar Romero.", "franciscosales": "Filho mais velho de uma família nobre da Saboia, nascido em 1567, estudou direito em Pádua para agradar ao pai, mas escolheu ser padre. Escreveu a “Filoteia”, morreu em 1622 e é doutor da Igreja.", "afonso": "Nascido em Nápoles em 1696, formou-se em direito aos 16 anos e foi advogado de sucesso até deixar a profissão. Foi bispo de Sant’Agata dei Goti, escreveu mais de cem livros e morreu em 1787, aos 90 anos. É doutor da Igreja.", "bernardo": "Nobre da Borgonha, nascido em 1090, entrou para o mosteiro de Cister com cerca de trinta parentes e amigos. Fundou a abadia de Claraval, pregou a Segunda Cruzada e morreu em 1153. É doutor da Igreja.", "crisostomo": "Nascido em Antioquia por volta de 349, foi monge e pregador antes de ser arcebispo de Constantinopla. Seus sermões contra o luxo da corte lhe valeram dois exílios, e morreu no segundo, em 407. É doutor da Igreja.", "dionisio": "Enviado de Roma para evangelizar a Gália no século III, foi o primeiro bispo de Paris e morreu mártir com dois companheiros, Rústico e Eleutério. Seu túmulo deu origem à basílica de Saint-Denis, onde estão sepultados os reis da França.", "ursula": "Sua história vem de uma inscrição antiga de Colônia, que fala de virgens mártires, e de lendas da Idade Média. Santa Ângela Merici a escolheu como padroeira da ordem que fundou em 1535, as ursulinas.", "genoveva": "Nascida em Nanterre, perto de Paris, por volta de 420, consagrou-se a Deus ainda menina. Em 451, convenceu os moradores de Paris a rezar em vez de fugir dos hunos de Átila, que acabaram desviando da cidade.", "damiao": "Jozef De Veuster nasceu na Bélgica em 1840, filho de camponeses. Foi missionário da Congregação dos Sagrados Corações no Havaí e foi canonizado em 2009. É padroeiro dos doentes de hanseníase.", "pedroclaver": "Nascido na Catalunha, na Espanha, em 1580, entrou para os jesuítas e foi enviado a Cartagena das Índias em 1610. Morreu ali em 1654, depois de quatro anos doente e quase esquecido. Foi canonizado em 1888.", "romero": "Nascido em 1917 numa pequena cidade de El Salvador, filho de um telegrafista, foi aprendiz de carpinteiro antes do seminário. Foi arcebispo de San Salvador de 1977 até a morte e foi canonizado em 2018.", "zita": "Nascida por volta de 1212 numa aldeia perto de Luca, na Itália, foi trabalhar como empregada aos 12 anos. Morreu em 1272, e seu corpo é conservado na basílica de São Frediano, em Luca.", "peregrino": "Nascido em Forlì, na Itália, por volta de 1260, numa família rica e envolvida na política. Converteu-se ainda jovem, entrou para os servitas e viveu até os 80 anos. Foi canonizado em 1726.", "luiszelia": "Casaram-se em 1858, em Alençon. Dos nove filhos, quatro morreram pequenos, e as cinco filhas que sobreviveram tornaram-se religiosas. Zélia morreu em 1877 e Luís, em 1894.", "luisamarillac": "Nascida em Paris em 1591, foi casada e teve um filho. Ficou viúva aos 34 anos e passou a trabalhar com São Vicente de Paulo nas obras de caridade. Morreu em 1660, poucos meses antes dele, e foi canonizada em 1934.", "pedroalcantara": "Nascido em Alcântara, na Espanha, em 1499, entrou para os franciscanos aos 16 anos e iniciou na ordem uma reforma de vida mais austera. Foi conselheiro de Santa Teresa d’Ávila. Morreu em 1562 e foi canonizado em 1669.", "cunhau": "Foram mortos em 16 de julho e 3 de outubro de 1645, no Rio Grande do Norte, então ocupado pelos holandeses. Entre os 30 canonizados em 2017 estão os padres André de Soveral e Ambrósio Francisco Ferro e o leigo Mateus Moreira.", "margaridaantioquia": "Filha de um sacerdote pagão de Antioquia da Pisídia, na atual Turquia, foi expulsa de casa por ser cristã e viveu como pastora. Teria sido martirizada por volta de 304. É uma das santas que Joana d’Arc dizia ouvir.", "paulomiki": "Filho de um chefe militar japonês, nascido por volta de 1562, estudou com os jesuítas e foi um grande pregador. Morreu pouco antes de ser ordenado padre e foi canonizado em 1862, com os outros mártires de Nagasaki.", "gil": "Grego de Atenas, segundo a tradição, foi para a Provença por volta do ano 700 e fundou ali uma abadia, em torno da qual nasceu a cidade de Saint-Gilles. Foi um dos santos mais populares da Idade Média.", "vito": "Menino da Sicília, filho de um pagão, foi criado por cristãos e martirizado por volta de 303, na perseguição de Diocleciano. É padroeiro de Praga, cuja catedral leva seu nome, e dos dançarinos.", "roquegonzalez": "Nascido em Assunção, no Paraguai, em 1576, numa família espanhola, falava guarani desde pequeno. Morreu com os jesuítas Afonso Rodrigues e João de Castilhos e foi canonizado em 1988, no Paraguai.", "kateri": "Filha de um chefe moicano e de uma mãe algonquina cristã, nasceu em 1656, no atual estado de Nova York. Batizada aos 20 anos, fugiu para uma missão no Canadá, onde morreu em 1680, aos 24. Foi canonizada em 2012.", "junipero": "Nascido na ilha de Maiorca, na Espanha, em 1713, foi professor de filosofia antes de partir como missionário para o México, aos 36 anos. Morreu em 1784, na missão de Carmel, e foi canonizado em 2015.", "fiacre": "Nascido na Irlanda no século VII, foi para a França e recebeu do bispo de Meaux um terreno na floresta, onde viveu como eremita até a morte, por volta de 670.", "venceslau": "Nascido por volta de 907, foi educado na fé pela avó, Santa Ludmila. Como duque, ajudou os pobres e construiu igrejas. Suas relíquias estão na catedral de São Vito, em Praga.", "clemente": "Foi o quarto papa, por volta dos anos 88 a 99, e segundo escritores antigos conheceu os apóstolos Pedro e Paulo. Suas relíquias foram levadas a Roma por São Cirilo e São Metódio.", "perpetua": "Perpétua tinha 22 anos, era nobre e mãe de um bebê. Escreveu na prisão um diário que foi preservado, um dos textos mais antigos escritos por uma mulher cristã. As duas são citadas na oração eucarística da missa.", "basilio": "Nascido em Cesareia por volta de 330, numa família de santos: a avó, os pais e três irmãos são venerados. Foi monge antes de ser bispo e morreu em 379. É doutor da Igreja.", "leao": "Nascido na Toscana por volta de 400, foi papa de 440 a 461. Sua carta sobre as duas naturezas de Cristo foi aclamada no Concílio de Calcedônia, em 451. É doutor da Igreja.", "anselmo": "Nascido em Aosta, na Itália, em 1033, foi monge e abade de Bec, na Normandia, antes de ser arcebispo da Cantuária. Morreu em 1109 e é doutor da Igreja.", "beda": "Entregue aos 7 anos ao mosteiro de Wearmouth-Jarrow, no norte da Inglaterra, viveu ali o resto da vida. Morreu em 735 e é o único doutor da Igreja inglês.", "norberto": "Nobre alemão nascido em Xanten por volta de 1080, levava vida de cortesão até que um raio caiu perto dele e o derrubou do cavalo. Fundou os premonstratenses em 1120 e morreu arcebispo de Magdeburgo, em 1134.", "kostka": "Filho de uma família nobre da Polônia, nascido em 1550, estudava em Viena. Contra a vontade do pai, caminhou centenas de quilômetros a pé até Roma para entrar na Companhia de Jesus. Morreu em 1568.", "angelamerici": "Nascida em Desenzano, perto do lago de Garda, em 1474, ficou órfã aos 15 anos e foi terciária franciscana. Ficou cega numa peregrinação à Terra Santa e recuperou a vista na volta. Morreu em 1540.", "lwanga": "Nascido por volta de 1860, foi batizado pouco antes de morrer. Ele e seus 21 companheiros católicos, os mártires de Uganda, foram canonizados em 1964. O santuário de Namugongo recebe multidões de peregrinos todo 3 de junho.", "cirilometodio": "Cirilo, o mais novo, morreu monge em Roma, em 869; Metódio morreu bispo na Morávia, em 885. O alfabeto cirílico, usado hoje no russo e em outras línguas, foi assim chamado em homenagem a Cirilo.", "solano": "Nascido em Montilla, na Espanha, em 1549, cuidou dos doentes numa epidemia de peste antes de partir para a América, aos 40 anos. Morreu em Lima, no Peru, em 1610, e foi canonizado em 1726.", "mariaegipciaca": "Viveu em Alexandria, no Egito, no século V. Converteu-se diante de uma imagem de Nossa Senhora em Jerusalém e passou cerca de 47 anos sozinha no deserto, além do Jordão. É muito venerada pelas Igrejas do Oriente.", "anjodaguarda": "A Bíblia fala de anjos enviados por Deus para guardar as pessoas, como no Salmo 91 e nas palavras de Jesus sobre os anjos dos pequeninos (Mateus 18,10). A festa dos Santos Anjos da Guarda é celebrada em 2 de outubro.", "zacariasisabel": "Segundo o Evangelho de Lucas, Zacarias era sacerdote do Templo de Jerusalém e Isabel descendia de Aarão. Já idosos e sem filhos, tornaram-se pais de São João Batista.", "agueda": "Jovem de família nobre da Sicília, recusou o governador romano Quinciano e foi presa e torturada em Catânia, por volta do ano 251, na perseguição do imperador Décio. Seu nome é citado na Oração Eucarística I da missa.", "floriano": "Oficial do exército romano na província do Nórico, na atual Áustria, declarou-se cristão durante a perseguição de Diocleciano e foi morto em 304. É padroeiro da Alta Áustria.", "lasalle": "Nascido em Reims, na França, em 1651, de família rica, tornou-se padre e distribuiu sua fortuna aos pobres. Morreu em Rouen em 1719 e foi canonizado em 1900.", "champagnat": "Nascido em 1789 perto de Lyon, na França, filho de camponeses, foi ordenado padre em 1816 e fundou os Irmãos Maristas em 1817, em La Valla. Morreu em 1840 e foi canonizado em 1999.", "aleixo": "Sua história é uma lenda nascida no Oriente, no século V, e muito contada na Idade Média. Em Roma, a igreja de Santo Aleixo, no monte Aventino, guarda a escada de madeira que a tradição diz ser a dele.", "hildegarda": "Nascida na Renânia, na Alemanha, em 1098, foi confiada ainda menina a um mosteiro beneditino. Abadessa, fundou o mosteiro de Rupertsberg, perto de Bingen, pregou em várias cidades e escreveu a papas e imperadores. Morreu em 1179.", "cabrini": "Nascida na Lombardia, na Itália, em 1850, fundou em 1880 as Missionárias do Sagrado Coração de Jesus. Chegou a Nova York em 1889 e abriu escolas, orfanatos e hospitais nas Américas. Morreu em Chicago em 1917 e foi a primeira cidadã dos Estados Unidos canonizada, em 1946.", "dimpna": "Sua história foi escrita no século XIII, a partir da tradição oral. Em Geel, onde estão suas relíquias, os moradores acolhem doentes mentais em suas próprias casas desde a Idade Média, costume que dura até hoje.", "albertomagno": "Nascido na Suábia, na Alemanha, por volta de 1200, entrou para os dominicanos e ensinou em Paris e em Colônia. Foi bispo de Ratisbona por pouco tempo e morreu em Colônia em 1280. Foi canonizado e declarado doutor da Igreja em 1931.", "nuno": "Nascido em 1360, foi o grande general de Dom João I na guerra que garantiu a independência de Portugal. Entrou no Carmo em 1423, com o nome de frei Nuno de Santa Maria, e morreu em 1431. Foi canonizado em 2009.", "joaodebrito": "Nascido em Lisboa em 1647, foi pajem na corte e companheiro do futuro rei Dom Pedro II. Entrou para os jesuítas e partiu para a Índia em 1673, para a missão de Maduré. Foi canonizado em 1947.", "erasmo": "Pouco se sabe ao certo de sua vida. Segundo a tradição, era bispo de Fórmias, na Itália, e morreu mártir por volta de 303, no tempo do imperador Diocleciano. É um dos catorze santos auxiliares, e suas relíquias estão na catedral de Gaeta.", "raimundopenaforte": "Nascido na Catalunha por volta de 1175, ensinou direito em Bolonha e entrou para os dominicanos já com mais de 40 anos. Foi superior geral da ordem e morreu em Barcelona em 1275, com cerca de cem anos. Foi canonizado em 1601.", "borja": "Nascido em Gandia, na Espanha, em 1510, bisneto do papa Alexandre VI, foi vice-rei da Catalunha e pai de oito filhos. Foi o terceiro superior geral dos jesuítas, de 1565 até a morte, em Roma, em 1572. Dá nome à cidade gaúcha de São Borja."};

  const imgFor = (id, md) => byId[id]?.serie ? (COM_SERIE[byId[id].serie].includes(id) ? arquivo(byId[id].serie, id) : null) : md === "imagem" ? (COM_FIGURA.includes(id) ? arquivo("santos", id) : null)
    : (COM_SIMBOLOS.includes(id) ? arquivo("simbolos", id) : null);
  function artFor(saint, md, rec) {
    const src = imgFor(saint.id, md);
    if (src && rec && saint.rec) {
      const [x, y, w] = saint.rec;
      return `<div class="recorte"><img class="glass" src="${src}" style="width:${100 / w}%;left:${-100 * x / w}%;top:${-100 * y / w}%" alt="Detalhe de um vitral"></div>`;
    }
    return src ? `<img class="glass" src="${src}" width="600" height="796" alt="${saint.serie ? colecao(saint.serie).legenda : md === "imagem" ? "Vitral de um santo" : "Vitral com símbolos de um santo"}">` : saint.serie ? "" : windowSVG(saint);
  }
  const $ = id => document.getElementById(id);
  // Nossa Senhora: os 40 títulos da coleção, com um vitral cada. A linha de baixo é gerada por ferramentas/textos_senhora.py
  const SENHORAS = [{"id": "nsaparecida", "name": "Nossa Senhora Aparecida", "curto": "Aparecida", "feast": "12 de outubro", "bio": "Em 1717, três pescadores tiraram do rio Paraíba do Sul, em Guaratinguetá (SP), uma pequena imagem de terracota: primeiro o corpo, depois a cabeça. Em seguida, as redes vieram cheias de peixe. É a padroeira do Brasil.", "why": "A imagem pequena e escura, de mãos postas: é de barro cozido e escureceu no fundo do rio. O manto azul em triângulo e a coroa foram postos nela depois, pela devoção do povo.", "serie": "nossasenhora"}, {"id": "nsfatima", "name": "Nossa Senhora de Fátima", "curto": "Fátima", "feast": "13 de maio", "bio": "Em 1917, em Fátima, Portugal, apareceu seis vezes, de maio a outubro, a três crianças pastoras: Lúcia e os irmãos Francisco e Jacinta Marto. Pediu oração, penitência e a reza diária do terço pela paz.", "why": "Toda de branco, com o terço nas mãos, sobre uma pequena azinheira: foi assim que os pastorinhos a descreveram, na Cova da Iria. As três crianças ajoelhadas são Lúcia, Francisco e Jacinta, com o rebanho.", "serie": "nossasenhora"}, {"id": "nsguadalupe", "name": "Nossa Senhora de Guadalupe", "curto": "Guadalupe", "feast": "12 de dezembro", "bio": "Em 1531, no monte Tepeyac, no México, apareceu ao indígena São Juan Diego. Como sinal para o bispo, mandou-o colher rosas em pleno inverno; quando ele abriu o manto, a imagem estava gravada no tecido. É a padroeira da América Latina.", "why": "O manto azul-esverdeado coberto de estrelas, os raios de sol em volta do corpo, a lua escura sob os pés e o anjo que a sustenta: é a imagem que ficou no manto de Juan Diego, guardado até hoje na basílica da Cidade do México.", "serie": "nossasenhora"}, {"id": "nslourdes", "name": "Nossa Senhora de Lourdes", "curto": "Lourdes", "feast": "11 de fevereiro", "bio": "Em 1858, em Lourdes, na França, apareceu dezoito vezes à menina Bernadete Soubirous, na gruta de Massabielle. Disse-lhe: “Eu sou a Imaculada Conceição”. A fonte que brotou na gruta atrai doentes do mundo inteiro.", "why": "A faixa azul na cintura, o terço no braço e uma rosa dourada sobre cada pé: é a descrição de Bernadete, a menina ajoelhada com a vela. A gruta e a fonte são as de Massabielle.", "serie": "nossasenhora"}, {"id": "nsgracas", "name": "Nossa Senhora das Graças", "curto": "Graças", "feast": "27 de novembro", "bio": "Em 1830, em Paris, apareceu a Santa Catarina Labouré, noviça das Filhas da Caridade, e pediu que se cunhasse uma medalha com aquela imagem. A medalha se espalhou tão depressa, e com tantas graças, que o povo a chamou de Medalha Milagrosa.", "why": "Os raios que saem das mãos abertas são as graças que ela derrama sobre quem as pede. Está de pé sobre o globo e pisa a serpente, com as estrelas em volta da cabeça, como na medalha.", "serie": "nossasenhora"}, {"id": "nsperpetuosocorro", "name": "Nossa Senhora do Perpétuo Socorro", "curto": "Perpétuo Socorro", "feast": "27 de junho", "bio": "É um ícone de estilo bizantino venerado em Roma, na igreja de Santo Afonso. Em 1866, o papa Pio IX o confiou aos missionários redentoristas, com o pedido de que o tornassem conhecido no mundo inteiro.", "why": "O Menino, assustado, agarra a mão da Mãe e olha para trás, e uma sandália lhe escapa do pé: ele viu os dois anjos que trazem os instrumentos da Paixão, a lança, a esponja, a cruz e os cravos. O fundo dourado é o dos ícones.", "serie": "nossasenhora"}, {"id": "nscarmo", "name": "Nossa Senhora do Carmo", "curto": "Carmo", "feast": "16 de julho", "bio": "O título vem do monte Carmelo, na Terra Santa, onde nasceu a Ordem dos Carmelitas. Segundo a tradição da ordem, em 1251 Nossa Senhora apareceu a São Simão Stock e lhe entregou o escapulário como sinal de proteção.", "why": "O hábito marrom e a capa branca são os dos carmelitas. O escapulário, dois pedaços de pano marrom ligados por cordões, está na mão dela e na do Menino. O monte ao fundo é o Carmelo.", "serie": "nossasenhora"}, {"id": "nsdores", "name": "Nossa Senhora das Dores", "curto": "Dores", "feast": "15 de setembro", "bio": "Lembra os sofrimentos de Maria ao lado do Filho, que a tradição conta em sete dores, da profecia de Simeão ao sepultamento de Jesus. A festa cai no dia seguinte ao da Exaltação da Santa Cruz.", "why": "As sete espadas no coração são as sete dores, e lembram a profecia de Simeão: “uma espada traspassará a tua alma”. O manto escuro e as lágrimas são do luto.", "serie": "nossasenhora"}, {"id": "nsrosario", "name": "Nossa Senhora do Rosário", "curto": "Rosário", "feast": "7 de outubro", "bio": "A festa foi instituída depois da batalha de Lepanto, em 1571, vitória que o papa São Pio V atribuiu à reza do rosário. Uma tradição dos dominicanos conta que a própria Virgem entregou o rosário a São Domingos.", "why": "Nossa Senhora, com o Menino no colo, entrega o rosário a São Domingos, de hábito branco e capa preta. As rosas lembram o nome da oração: rosário quer dizer coroa de rosas.", "serie": "nossasenhora"}, {"id": "nsimaculada", "name": "Nossa Senhora da Imaculada Conceição", "curto": "Imaculada Conceição", "feast": "8 de dezembro", "bio": "Celebra a fé de que Maria foi preservada do pecado original desde o primeiro instante de sua existência, dogma proclamado pelo papa Pio IX em 1854. É padroeira de Portugal e de muitas cidades brasileiras.", "why": "A jovem de mãos no peito e olhos no céu, sobre a lua e o globo, com as estrelas em volta da cabeça, é a “mulher vestida de sol” do Apocalipse. A imagem ficou famosa nas pinturas do espanhol Murillo.", "serie": "nossasenhora"}, {"id": "nsauxiliadora", "name": "Nossa Senhora Auxiliadora", "curto": "Auxiliadora", "feast": "24 de maio", "bio": "O título “Auxílio dos Cristãos” é antigo. A festa foi criada pelo papa Pio VII, em agradecimento por ter voltado a Roma em 24 de maio de 1814, depois de anos preso por Napoleão. São João Bosco espalhou a devoção e lhe dedicou a basílica de Turim.", "why": "O cetro e a coroa são de rainha. O Menino, também coroado, abre os braços para acolher. É a imagem do quadro que Dom Bosco mandou pintar para a basílica de Turim.", "serie": "nossasenhora"}, {"id": "nsnazare", "name": "Nossa Senhora de Nazaré", "curto": "Nazaré", "feast": "segundo domingo de outubro (Círio de Nazaré)", "bio": "Por volta de 1700, o caboclo Plácido achou uma pequena imagem à beira de um igarapé, em Belém do Pará. Conta-se que ele a levava para casa e ela voltava ao lugar onde foi achada; ali se ergueu a basílica. O Círio de Nazaré é uma das maiores procissões do mundo.", "why": "A pequena imagem com o Menino, de manto bordado, vai dentro da berlinda enfeitada de flores, o andor fechado que percorre as ruas de Belém. A corda é a que os promesseiros seguram durante toda a procissão.", "serie": "nossasenhora"}, {"id": "nsdesatadora", "name": "Nossa Senhora Desatadora dos Nós", "curto": "Desatadora dos Nós", "feast": "sem data única (15 de agosto ou 8 de dezembro, conforme o lugar)", "bio": "A devoção nasceu de um quadro pintado por volta de 1700 para a igreja de São Pedro, em Augsburgo, na Alemanha. Os nós são as dificuldades da vida, que ela desfaz. O papa Francisco, que conheceu a imagem na Alemanha, ajudou a espalhar a devoção na Argentina e no Brasil.", "why": "Um anjo entrega a fita cheia de nós, Nossa Senhora os desata, e o outro anjo recebe a fita lisa. A pomba é o Espírito Santo, e a lua sob os pés vem da mulher do Apocalipse.", "serie": "nossasenhora"}, {"id": "nsassuncao", "name": "Nossa Senhora da Assunção", "curto": "Assunção", "feast": "15 de agosto", "bio": "Celebra a fé de que Maria, terminada a vida na terra, foi levada ao céu em corpo e alma. O dogma foi proclamado pelo papa Pio XII em 1950, mas a festa é celebrada desde os primeiros séculos.", "why": "Maria sobe ao céu de braços abertos, levada pelos anjos. Embaixo fica o túmulo vazio, cheio de flores: segundo uma tradição antiga, foi o que os apóstolos encontraram no lugar do corpo.", "serie": "nossasenhora"}, {"id": "nspiedade", "name": "Nossa Senhora da Piedade", "curto": "Piedade", "feast": "15 de setembro", "bio": "Lembra o momento em que Maria recebe nos braços o corpo de Jesus descido da cruz. A cena, chamada Pietà, é uma das mais representadas da arte cristã. Nossa Senhora da Piedade é a padroeira de Minas Gerais.", "why": "O corpo de Jesus morto no colo da Mãe, ao pé da cruz já vazia. A coroa de espinhos ficou no chão.", "serie": "nossasenhora"}, {"id": "nsnavegantes", "name": "Nossa Senhora dos Navegantes", "curto": "Navegantes", "feast": "2 de fevereiro", "bio": "É a protetora dos pescadores e dos marinheiros, devoção trazida pelos navegadores portugueses. No Brasil, a festa mais conhecida é a de Porto Alegre, com procissão em 2 de fevereiro.", "why": "De pé num barco à vela, sobre as ondas, com o Menino num braço e a âncora na outra mão. A estrela no alto lembra outro título dela, Estrela do Mar, a que guia quem navega.", "serie": "nossasenhora"}, {"id": "nspenha", "name": "Nossa Senhora da Penha", "curto": "Penha", "feast": "varia conforme o lugar (no Rio de Janeiro, os domingos de outubro)", "bio": "Penha quer dizer rochedo. Segundo a tradição, em 1434 o peregrino francês Simão Vela achou uma imagem de Maria no alto da Penha de França, na Espanha. No Brasil, a devoção ergueu igrejas no alto de pedras, como o convento de Vila Velha (ES) e a igreja da Penha, no Rio de Janeiro.", "why": "Nossa Senhora com o Menino no topo de um penhasco altíssimo, com a igrejinha branca e a escadaria talhada na pedra, como a da Penha, no Rio de Janeiro, que os romeiros sobem pagando promessa.", "serie": "nossasenhora"}, {"id": "nssalete", "name": "Nossa Senhora da Salete", "curto": "Salete", "feast": "19 de setembro", "bio": "Em 1846, em La Salette, nos Alpes da França, apareceu a duas crianças pastoras, Maximino e Melânia. Estava sentada, chorando, e pediu a conversão do povo, a oração e o respeito ao domingo.", "why": "Sentada numa pedra, com o rosto entre as mãos, chorando: foi assim que as duas crianças a viram primeiro. No peito traz um crucifixo com um martelo de um lado e uma torquês do outro; na cabeça e no xale, rosas.", "serie": "nossasenhora"}, {"id": "nscandelaria", "name": "Nossa Senhora da Candelária", "curto": "Candelária", "feast": "2 de fevereiro", "bio": "O título vem da festa da Apresentação do Senhor, quarenta dias depois do Natal, quando Maria e José levaram o Menino ao Templo. Nesse dia se benzem as velas, as candeias, porque o velho Simeão chamou Jesus de “luz para iluminar as nações”. Também é chamada Nossa Senhora das Candeias ou da Luz.", "why": "A vela acesa na mão é a candeia que dá nome ao título. As duas pombas no cesto são a oferta dos pobres, que Maria e José levaram ao Templo.", "serie": "nossasenhora"}, {"id": "nsdesterro", "name": "Nossa Senhora do Desterro", "curto": "Desterro", "feast": "17 de fevereiro (em Florianópolis)", "bio": "Desterro quer dizer exílio. O título lembra a fuga da Sagrada Família para o Egito, quando o rei Herodes mandou matar os meninos de Belém. Florianópolis nasceu com o nome de Nossa Senhora do Desterro.", "why": "Maria no burrinho, com o Menino no colo, e São José à frente, a pé, puxando o animal. As palmeiras e a pirâmide ao longe mostram que a família já chegou ao Egito.", "serie": "nossasenhora"}, {"id": "nsconsolacao", "name": "Nossa Senhora da Consolação e Correia", "curto": "Consolação e Correia", "feast": "4 de setembro", "bio": "É a padroeira da família agostiniana. Conta a tradição que Santa Mônica, aflita com a vida do filho Agostinho, pediu consolo a Nossa Senhora, que lhe apareceu vestida de luto, com uma correia na cintura, e mandou que se vestisse do mesmo modo.", "why": "Nossa Senhora, com o Menino, entrega a correia preta a Santo Agostinho, de mitra de bispo, e a Santa Mônica, sua mãe. A correia é o cinto de couro do hábito dos agostinianos.", "serie": "nossasenhora"}, {"id": "nsloreto", "name": "Nossa Senhora de Loreto", "curto": "Loreto", "feast": "10 de dezembro", "bio": "Em Loreto, na Itália, venera-se a Santa Casa, que a tradição diz ser a casa de Maria em Nazaré, levada pelos anjos para lá no fim do século XIII. Por causa desse voo, Nossa Senhora de Loreto é a padroeira dos aviadores.", "why": "Nossa Senhora e o Menino sobre o telhado da casinha de tijolos, que os anjos carregam pelo céu, por cima do mar. A veste em forma de sino, cheia de joias, é a que cobre a imagem venerada em Loreto.", "serie": "nossasenhora"}, {"id": "nsmerces", "name": "Nossa Senhora das Mercês", "curto": "Mercês", "feast": "24 de setembro", "bio": "Em 1218, em Barcelona, São Pedro Nolasco fundou a Ordem das Mercês para resgatar os cristãos feitos escravos, segundo a tradição a pedido da própria Virgem. Mercê quer dizer misericórdia, favor.", "why": "Toda de branco, como os frades mercedários, com o escudo da ordem no peito. Nas mãos, os grilhões abertos; aos pés, os cativos libertados, com as correntes quebradas.", "serie": "nossasenhora"}, {"id": "nsmaerainha", "name": "Mãe Rainha de Schoenstatt", "curto": "Mãe Rainha", "feast": "18 de outubro", "bio": "Em 18 de outubro de 1914, na capelinha de Schoenstatt, na Alemanha, o padre José Kentenich e um grupo de jovens fizeram com Maria uma aliança de amor. O quadro da “Mãe Três Vezes Admirável” visita as casas, de família em família, na Campanha da Mãe Peregrina, iniciada no Brasil por João Pozzobon.", "why": "A Mãe aperta o Menino contra si, os dois envoltos no mesmo véu: é o quadro venerado nas capelinhas do movimento. A capelinha branca ao fundo é a de Schoenstatt, copiada igual no mundo inteiro.", "serie": "nossasenhora"}, {"id": "nsbomconselho", "name": "Nossa Senhora do Bom Conselho", "curto": "Bom Conselho", "feast": "26 de abril", "bio": "É um afresco venerado em Genazzano, perto de Roma, na igreja dos agostinianos. Conta a tradição que a imagem apareceu na parede da igreja em 25 de abril de 1467, vinda da Albânia.", "why": "O Menino cola o rosto no da Mãe, com um braço em volta do pescoço dela, como quem lhe fala ao ouvido. O arco-íris aparece atrás dos dois na imagem de Genazzano.", "serie": "nossasenhora"}, {"id": "nsrosamistica", "name": "Nossa Senhora Rosa Mística", "curto": "Rosa Mística", "feast": "13 de julho", "bio": "Rosa Mística é um dos nomes de Maria na ladainha. A imagem das três rosas vem dos relatos de Pierina Gilli, enfermeira italiana que disse ter visto Nossa Senhora em Montichiari, a partir de 1947. A devoção se espalhou muito no Brasil.", "why": "As três rosas no peito: a branca é a oração, a vermelha o sacrifício e a dourada a penitência.", "serie": "nossasenhora"}, {"id": "nscaravaggio", "name": "Nossa Senhora de Caravaggio", "curto": "Caravaggio", "feast": "26 de maio", "bio": "Em 26 de maio de 1432, perto da vila de Caravaggio, na Itália, apareceu à camponesa Joaneta, que cortava capim para os animais e sofria com os maus-tratos do marido. No lugar brotou uma fonte. Os imigrantes italianos trouxeram a devoção para o Rio Grande do Sul, onde fica o santuário de Farroupilha.", "why": "A camponesa Joaneta ajoelhada, a fonte que brota do chão entre as duas, e no chão o feixe de capim e a foice que ela largou ao ver Nossa Senhora.", "serie": "nossasenhora"}, {"id": "nsdoo", "name": "Nossa Senhora do Ó", "curto": "do Ó", "feast": "18 de dezembro", "bio": "É Nossa Senhora grávida, à espera do nascimento de Jesus; por isso também se chama Nossa Senhora da Expectação. O nome vem das antífonas cantadas nos sete dias antes do Natal, que começam todas com a exclamação “Ó”.", "why": "A mão pousada sobre o ventre: Maria está grávida de Jesus. Não há Menino no colo, porque ele ainda vai nascer.", "serie": "nossasenhora"}, {"id": "nsneves", "name": "Nossa Senhora das Neves", "curto": "Neves", "feast": "5 de agosto", "bio": "Conta a tradição que, no século IV, numa noite de agosto, em pleno verão, nevou no monte Esquilino, em Roma, desenhando no chão a planta de uma igreja. Ali foi erguida a basílica de Santa Maria Maior, a maior igreja de Roma dedicada a Maria.", "why": "A neve cai sob o sol de verão. Na colina, a mancha de neve tem a forma da planta de uma igreja, e ao lado está a basílica que ali se construiu.", "serie": "nossasenhora"}, {"id": "nspilar", "name": "Nossa Senhora do Pilar", "curto": "Pilar", "feast": "12 de outubro", "bio": "Segundo a tradição, Nossa Senhora, ainda viva em Jerusalém, apareceu ao apóstolo São Tiago às margens do rio Ebro, em Saragoça, na Espanha, sobre uma coluna de pedra, para animá-lo na pregação. É a padroeira da Espanha.", "why": "A pequena imagem com o Menino no alto de uma coluna, o pilar que dá nome ao título, com o resplendor redondo atrás. Ajoelhado junto ao rio está São Tiago, de peregrino.", "serie": "nossasenhora"}, {"id": "nsmontserrat", "name": "Nossa Senhora de Montserrat", "curto": "Montserrat", "feast": "27 de abril", "bio": "É a padroeira da Catalunha, venerada num mosteiro beneditino no alto da serra de Montserrat, perto de Barcelona. Por causa da cor escura, o povo a chama de “la Moreneta”, a moreninha. Diante dela, Santo Inácio de Loyola deixou a espada e mudou de vida.", "why": "A imagem escura, sentada no trono, com o globo na mão direita e o Menino no colo. Ao fundo, a serra de pontas arredondadas, que parece serrada: Montserrat quer dizer “monte serrado”.", "serie": "nossasenhora"}, {"id": "nsczestochowa", "name": "Nossa Senhora de Czestochowa", "curto": "Czestochowa", "feast": "26 de agosto", "bio": "É o ícone mais venerado da Polônia, guardado no mosteiro de Jasna Góra desde o século XIV. Em 1430, ladrões atacaram o santuário e golpearam a imagem; as marcas nunca saíram. São João Paulo II era seu grande devoto.", "why": "As duas cicatrizes no rosto são as marcas do ataque de 1430. A pele escura deu-lhe o nome de Virgem Negra. Com a mão, ela aponta para o Menino, que segura um livro e abençoa.", "serie": "nossasenhora"}, {"id": "nslujan", "name": "Nossa Senhora de Luján", "curto": "Luján", "feast": "8 de maio", "bio": "Em 1630, uma carroça que levava uma pequena imagem da Imaculada Conceição parou à beira do rio Luján, na Argentina, e os bois só voltaram a andar quando a imagem foi descida. O povo entendeu que ela queria ficar ali. É a padroeira da Argentina.", "why": "A imagem pequena, de mãos postas, com o manto azul-celeste e a túnica branca, as cores da bandeira argentina. Os raios dourados a cercam por inteiro, e ela pisa a meia-lua.", "serie": "nossasenhora"}, {"id": "nscabeca", "name": "Nossa Senhora da Cabeça", "curto": "Cabeça", "feast": "último domingo de abril (em Andújar, na Espanha)", "bio": "O nome vem do Cerro da Cabeça, monte da Andaluzia onde, segundo a tradição, um pastor de braço paralisado achou a imagem em 1227 e ficou curado. No Brasil, o nome fez dela a protetora de quem sofre de doenças e dores de cabeça e de quem estuda.", "why": "Nossa Senhora, com o Menino num braço, traz uma cabeça na palma da outra mão: é assim que a imagem é feita no Brasil. Conta-se que um condenado à morte, salvo por ela, lhe ofereceu uma cabeça de cera em agradecimento.", "serie": "nossasenhora"}, {"id": "nssagradocoracao", "name": "Nossa Senhora do Sagrado Coração", "curto": "Sagrado Coração", "feast": "último sábado de maio", "bio": "O título foi criado em 1857 pelo padre francês Júlio Chevalier, fundador dos Missionários do Sagrado Coração, em Issoudun, na França. Quer dizer que Maria leva ao coração de Jesus quem recorre a ela.", "why": "O Menino aponta para o próprio coração em chamas e, com a outra mão, para o alto, para a Mãe: quem procura o coração dele pode pedir por meio dela.", "serie": "nossasenhora"}, {"id": "nsrainhadapaz", "name": "Nossa Senhora Rainha da Paz", "curto": "Rainha da Paz", "feast": "sem data única no calendário", "bio": "Em maio de 1917, em plena Primeira Guerra Mundial, o papa Bento XV pediu orações pela paz e mandou acrescentar à ladainha de Nossa Senhora a invocação “Rainha da paz, rogai por nós”. Poucos dias depois começaram as aparições de Fátima.", "why": "O ramo de oliveira na mão e a pomba com o raminho no bico são sinais de paz desde a história de Noé. O Menino no outro braço é o Príncipe da Paz.", "serie": "nossasenhora"}, {"id": "nsdoleite", "name": "Nossa Senhora do Leite", "curto": "do Leite", "feast": "sem data única no calendário", "bio": "É uma das representações mais antigas de Maria: a mãe que amamenta o filho, sinal de que Jesus foi um bebê de verdade. Em Belém existe a Gruta do Leite, onde a tradição diz que a Sagrada Família se abrigou. Muitas mães pedem a ela ajuda para amamentar.", "why": "Maria, sentada, amamenta o Menino, coberta pelo manto.", "serie": "nossasenhora"}, {"id": "nsboamorte", "name": "Nossa Senhora da Boa Morte", "curto": "Boa Morte", "feast": "15 de agosto", "bio": "Lembra o fim da vida de Maria na terra, que os cristãos do Oriente chamam de Dormição: ela adormece cercada pelos apóstolos, antes de ser levada ao céu. No Brasil, a festa mais conhecida é a da Irmandade da Boa Morte, em Cachoeira, na Bahia, em agosto.", "why": "Maria deitada, de olhos fechados e mãos cruzadas no peito, com os apóstolos em volta do leito. A vela acesa é a que se põe junto de quem está morrendo.", "serie": "nossasenhora"}, {"id": "nsrainha", "name": "Nossa Senhora Rainha", "curto": "Nossa Senhora Rainha", "feast": "22 de agosto", "bio": "A festa foi criada pelo papa Pio XII em 1954 e é celebrada oito dias depois da Assunção. É também o quinto mistério glorioso do rosário: a coroação de Maria como rainha do céu e da terra.", "why": "Maria, ajoelhada sobre as nuvens, recebe a coroa das mãos de Jesus e de Deus Pai, com a pomba do Espírito Santo no alto: é coroada pela Santíssima Trindade.", "serie": "nossasenhora"}, {"id": "nslibano", "name": "Nossa Senhora do Líbano", "curto": "Líbano", "feast": "primeiro domingo de maio", "bio": "É a grande estátua branca no alto do monte de Harissa, voltada para o mar, inaugurada em 1908. Os libaneses sobem até lá em peregrinação, e os imigrantes trouxeram a devoção ao Brasil.", "why": "Toda de branco, de braços abertos voltados para o mar, no alto da torre branca em espiral. Os cedros dos lados são a árvore símbolo do Líbano.", "serie": "nossasenhora"}];
