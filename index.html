  // Passagens bíblicas das coleções Novo e Antigo Testamento, com um vitral cada. A linha de baixo é gerada por ferramentas/biblia.py
  const PASSAGENS = [{"id": "ntanunciacao", "name": "Anunciação", "feast": "Lc 1,26-38", "bio": "O anjo Gabriel é enviado a Nazaré para anunciar a Maria que ela será a mãe do Filho de Deus. Ela responde: “Eis a serva do Senhor; faça-se em mim segundo a tua palavra”.", "why": "O anjo Gabriel, com o lírio na mão, diante de Maria em oração. A pomba no raio de luz é o Espírito Santo.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.36, 0.34, 0.3], "q": {"t": "Em que cidade Maria vivia quando o anjo Gabriel foi enviado a ela?", "c": "Nazaré", "e": ["Belém", "Jerusalém", "Cafarnaum"], "ref": "Lc 1,26"}, "frases": [{"t": "Eis aqui a serva do Senhor. Faça-se em mim segundo a tua palavra.", "ref": "Lc 1,38"}]}, {"id": "ntnascimento", "name": "Nascimento de Jesus", "feast": "Lc 2,1-20", "bio": "Maria e José vão a Belém para o recenseamento. Sem lugar na hospedaria, o Menino nasce e é posto numa manjedoura. Os anjos avisam os pastores, que vão correndo vê-lo.", "why": "O Menino na manjedoura, entre Maria e José, com o boi e o burro. Quem chega são os pastores, com um cordeiro.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.22, 0.24, 0.26], "q": {"t": "Por que José e Maria tinham ido a Belém?", "c": "Por causa do recenseamento", "e": ["Para a festa da Páscoa", "Para fugir de Herodes", "Para visitar Isabel"], "ref": "Lc 2,1-4"}, "frases": [{"t": "E deu à luz seu filho primogênito, e, envolvendo-o em faixas, reclinou-o num presépio; porque não havia lugar para eles na hospedaria.", "ref": "Lc 2,7"}]}, {"id": "ntreismagos", "name": "Adoração dos Reis Magos", "feast": "Mt 2,1-12", "bio": "Magos do Oriente seguem uma estrela até Belém, encontram o Menino com Maria e lhe oferecem ouro, incenso e mirra. Avisados em sonho, voltam por outro caminho, sem passar por Herodes.", "why": "Os três reis, de coroa, com os presentes: o ouro, o incenso e a mirra. A estrela que os guiou parou sobre a casa.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.36, 0.28, 0.28], "q": {"t": "Como os magos foram avisados de que não deviam voltar a Herodes?", "c": "Em sonhos", "e": ["Pela estrela", "Por um pastor", "Por uma carta de José"], "ref": "Mt 2,12"}, "frases": [{"t": "Onde está o rei dos judeus que acaba de nascer? Vimos a sua estrela no Oriente e viemos adorá-lo.", "ref": "Mt 2,2"}]}, {"id": "ntbatismo", "name": "Batismo de Jesus", "feast": "Mt 3,13-17", "bio": "Jesus vai ao rio Jordão e é batizado por João Batista. O céu se abre, o Espírito desce como uma pomba e uma voz diz: “Este é o meu Filho amado”.", "why": "Jesus dentro do rio e João Batista, de roupa de pelo de camelo, derramando a água. A pomba que desce é o Espírito Santo.", "serie": "novotestamento", "grupo": "inicio", "rec": [0.25, 0.2, 0.3], "q": {"t": "O que João disse quando Jesus veio até ele?", "c": "Que ele é que devia ser batizado por Jesus", "e": ["Que Jesus devia voltar no dia seguinte", "Que não havia água bastante", "Que Jesus devia primeiro jejuar"], "ref": "Mt 3,14"}, "frases": [{"t": "Eis que os céus se abriram e viu descer sobre ele, em forma de pomba, o Espírito de Deus.", "ref": "Mt 3,16"}]}, {"id": "ntcana", "name": "Bodas de Caná", "feast": "Jo 2,1-11", "bio": "Numa festa de casamento, o vinho acaba. Maria avisa Jesus e diz aos servos: “Fazei tudo o que ele vos disser”. Jesus manda encher seis talhas de água, e a água vira vinho: é o seu primeiro milagre.", "why": "As seis talhas de pedra que os servos enchem de água, com os noivos à mesa. Maria está ao lado de Jesus: foi ela quem pediu.", "serie": "novotestamento", "grupo": "inicio", "rec": [0.2, 0.62, 0.36], "q": {"t": "Quem avisou Jesus de que o vinho tinha acabado?", "c": "Sua mãe", "e": ["O noivo", "Pedro", "O chefe dos serventes"], "ref": "Jo 2,3"}, "frases": [{"t": "Fazei o que ele vos disser.", "ref": "Jo 2,5"}]}, {"id": "ntpaes", "name": "Multiplicação dos pães", "feast": "Jo 6,1-15", "bio": "Uma multidão segue Jesus e não há o que comer. Um menino tem cinco pães e dois peixes. Jesus dá graças e manda distribuir: cinco mil homens comem, e ainda sobram doze cestos.", "why": "O menino entrega os cinco pães e os dois peixes, e Jesus os abençoa. A multidão está sentada na relva, e os discípulos carregam os cestos cheios.", "serie": "novotestamento", "grupo": "mar", "rec": [0.38, 0.38, 0.28], "q": {"t": "Quantos cestos se encheram com os pedaços que sobraram?", "c": "Doze", "e": ["Sete", "Cinco", "Três"], "ref": "Jo 6,13"}, "frases": [{"t": "Está aqui um menino que tem cinco pães de cevada e dois peixes... mas que é isto para tanta gente?", "ref": "Jo 6,9"}]}, {"id": "ntceia", "name": "Última Ceia", "feast": "Lc 22,14-20", "bio": "Na véspera de sua morte, Jesus ceia com os doze apóstolos. Toma o pão e o cálice e diz: “Isto é o meu corpo; este é o cálice do meu sangue. Fazei isto em memória de mim”.", "why": "Jesus no centro da mesa, com o pão nas mãos e o cálice diante dele, entre os doze apóstolos. O jovem recostado nele é João.", "serie": "novotestamento", "grupo": "paixao", "rec": [0.28, 0.44, 0.28], "q": {"t": "Que festa Jesus quis celebrar com os apóstolos naquela ceia?", "c": "A Páscoa", "e": ["Pentecostes", "A festa das Tendas", "A Dedicação do Templo"], "ref": "Lc 22,15"}, "frases": [{"t": "Isto é o meu corpo, que é dado por vós; fazei isto em memória de mim.", "ref": "Lc 22,19"}]}, {"id": "ntcrucificacao", "name": "Crucificação", "feast": "Jo 19,17-30", "bio": "Jesus é crucificado no Calvário, entre dois ladrões. Da cruz, entrega sua mãe ao discípulo amado e diz: “Tudo está consumado”.", "why": "Jesus na cruz, com Maria e o apóstolo João de pé e Maria Madalena ajoelhada. O céu escurece.", "serie": "novotestamento", "grupo": "paixao", "rec": [0.28, 0.6, 0.32], "q": {"t": "A quem Jesus confiou sua mãe?", "c": "Ao discípulo que ele amava", "e": ["A Pedro", "A José de Arimateia", "A Maria Madalena"], "ref": "Jo 19,26-27"}, "frases": [{"t": "Tudo está consumado.", "ref": "Jo 19,30"}]}, {"id": "ntressurreicao", "name": "Ressurreição", "feast": "Mt 28,1-10", "bio": "Na manhã do primeiro dia da semana, as mulheres vão ao túmulo e o encontram aberto. Um anjo lhes diz: “Ele não está aqui, ressuscitou”.", "why": "Jesus sai vivo do túmulo, com a pedra rolada para o lado e os soldados caídos no chão. O estandarte branco com a cruz é o sinal da vitória sobre a morte.", "serie": "novotestamento", "grupo": "gloria", "rec": [0.08, 0.58, 0.34], "q": {"t": "Segundo Mateus, quem rolou a pedra do túmulo?", "c": "Um anjo do Senhor", "e": ["Os soldados", "As mulheres", "Pedro e João"], "ref": "Mt 28,2"}, "frases": [{"t": "Não temais! Sei que procurais Jesus, que foi crucificado.", "ref": "Mt 28,5"}]}, {"id": "ntpentecostes", "name": "Pentecostes", "feast": "At 2,1-13", "bio": "Cinquenta dias depois da Páscoa, os apóstolos estão reunidos com Maria. Vem do céu um barulho de vento forte, línguas de fogo pousam sobre cada um, e todos ficam cheios do Espírito Santo e saem a pregar.", "why": "Uma língua de fogo sobre a cabeça de cada um, com Maria no centro dos apóstolos. A pomba é o Espírito Santo.", "serie": "novotestamento", "grupo": "gloria", "rec": [0.12, 0.28, 0.28], "q": {"t": "Quem se pôs de pé com os Onze e falou à multidão naquele dia?", "c": "Pedro", "e": ["João", "Tiago", "Paulo"], "ref": "At 2,14"}, "frases": [{"t": "Ficaram todos cheios do Espírito Santo e começaram a falar em outras línguas, conforme o Espírito Santo lhes concedia que falassem.", "ref": "At 2,4"}]}, {"id": "ntvisitacao", "name": "Visitação", "feast": "Lc 1,39-56", "bio": "Depois do anúncio do anjo, Maria vai às pressas visitar a prima Isabel, que também espera um filho, João Batista. O menino salta no ventre de Isabel, e Maria canta o Magnificat.", "why": "Maria, jovem, e Isabel, idosa, abraçadas à porta da casa, as duas grávidas. O homem à porta é Zacarias, marido de Isabel.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.34, 0.42, 0.3], "q": {"t": "Quanto tempo Maria ficou com Isabel?", "c": "Cerca de três meses", "e": ["Uma semana", "Quarenta dias", "Um ano"], "ref": "Lc 1,56"}, "frases": [{"t": "Bendita és tu entre as mulheres e bendito é o fruto do teu ventre.", "ref": "Lc 1,42"}]}, {"id": "ntapresentacao", "name": "Apresentação no Templo", "feast": "Lc 2,22-40", "bio": "Quarenta dias depois do nascimento, Maria e José levam o Menino ao Templo. O velho Simeão o toma nos braços e o chama de luz das nações; a Maria, diz que uma espada lhe traspassará a alma.", "why": "O velho Simeão com o Menino nos braços. José traz as duas pombas, a oferta dos pobres, e a idosa é a profetisa Ana.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.02, 0.3, 0.3], "q": {"t": "O que Simeão anunciou a Maria?", "c": "Que uma espada transpassaria a sua alma", "e": ["Que ela teria outros sete filhos", "Que ela veria o Templo destruído", "Que ela voltaria a Nazaré naquele dia"], "ref": "Lc 2,35"}, "frases": [{"t": "Agora, Senhor, deixai o vosso servo ir em paz, segundo a vossa palavra.", "ref": "Lc 2,29"}]}, {"id": "ntfuga", "name": "Fuga para o Egito", "feast": "Mt 2,13-15", "bio": "Um anjo avisa José em sonho que Herodes quer matar o Menino. José se levanta de noite, toma o Menino e a mãe e foge para o Egito, onde ficam até a morte de Herodes.", "why": "Maria no burrinho com o Menino, e José à frente, a pé, de noite. O anjo é o que avisou José em sonho.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.4, 0.5, 0.34], "q": {"t": "Até quando José ficou no Egito com o menino e sua mãe?", "c": "Até a morte de Herodes", "e": ["Até o menino fazer doze anos", "Até a Páscoa seguinte", "Até os magos voltarem"], "ref": "Mt 2,15"}, "frases": [{"t": "Levanta-te, toma o menino e sua mãe [...] porque Herodes vai procurar o menino para o matar.", "ref": "Mt 2,13"}]}, {"id": "ntdoutores", "name": "Jesus entre os doutores", "feast": "Lc 2,41-52", "bio": "Aos doze anos, Jesus fica em Jerusalém sem que os pais percebam. Depois de três dias, Maria e José o encontram no Templo, sentado entre os doutores, ouvindo e fazendo perguntas.", "why": "O menino de doze anos sentado no meio dos mestres da Lei, com seus rolos. À porta chegam Maria e José, aflitos.", "serie": "novotestamento", "grupo": "infancia", "rec": [0.12, 0.6, 0.32], "q": {"t": "Depois de quantos dias Maria e José acharam Jesus no templo?", "c": "Três dias", "e": ["Um dia", "Sete dias", "Quarenta dias"], "ref": "Lc 2,46"}, "frases": [{"t": "Por que me procuráveis? Não sabíeis que devo ocupar-me das coisas de meu Pai?", "ref": "Lc 2,49"}]}, {"id": "nttentacao", "name": "Tentação no deserto", "feast": "Mt 4,1-11", "bio": "Jesus jejua quarenta dias no deserto. O diabo o tenta três vezes: que transforme pedras em pão, que se atire do alto do Templo, que o adore em troca dos reinos do mundo. Jesus responde com a Escritura.", "why": "O diabo oferece pedras a Jesus, para que as transforme em pão. É a primeira das três tentações.", "serie": "novotestamento", "grupo": "inicio", "rec": [0.3, 0.28, 0.26], "q": {"t": "Por quanto tempo Jesus jejuou?", "c": "Quarenta dias e quarenta noites", "e": ["Três dias e três noites", "Sete dias", "Doze dias"], "ref": "Mt 4,2"}, "frases": [{"t": "Não só de pão vive o homem, mas de toda palavra que procede da boca de Deus.", "ref": "Mt 4,4"}]}, {"id": "ntpesca", "name": "Pesca milagrosa", "feast": "Lc 5,1-11", "bio": "Depois de uma noite inteira sem pescar nada, Pedro lança as redes porque Jesus manda. Vêm tantos peixes que as redes quase se rompem. Jesus lhe diz: “De agora em diante serás pescador de homens”.", "why": "Os pescadores puxam a rede, a ponto de se romper de tanto peixe, num lago calmo. Pedro se volta para Jesus, espantado.", "serie": "novotestamento", "grupo": "mar", "rec": [0.25, 0.62, 0.36], "q": {"t": "O que Simão Pedro disse a Jesus ao ver tantos peixes?", "c": "“Retira-te de mim, Senhor, porque sou um homem pecador”", "e": ["“Senhor, salva-nos, que perecemos”", "“Tu és o Cristo”", "“Senhor, a quem iríamos nós?”"], "ref": "Lc 5,8"}, "frases": [{"t": "Mestre, trabalhamos a noite inteira e nada apanhamos; mas, por causa de tua palavra, lançarei a rede.", "ref": "Lc 5,5"}]}, {"id": "nttempestade", "name": "Tempestade acalmada", "feast": "Mc 4,35-41", "bio": "Uma tempestade apanha o barco no meio do lago, e Jesus dorme na popa. Os discípulos o acordam, apavorados. Ele manda o vento e o mar se calarem, e vem uma grande calma.", "why": "O barco entre ondas enormes e raios, com os discípulos apavorados. Jesus, de pé dentro do barco, manda o vento se calar.", "serie": "novotestamento", "grupo": "mar", "rec": [0.1, 0.4, 0.3], "q": {"t": "O que Jesus fazia quando os discípulos foram chamá-lo?", "c": "Dormia na popa", "e": ["Rezava no monte", "Ensinava a multidão", "Remava com eles"], "ref": "Mc 4,38"}, "frases": [{"t": "Quem é este, a quem até o vento e o mar obedecem?", "ref": "Mc 4,41"}]}, {"id": "ntaguas", "name": "Jesus anda sobre as águas", "feast": "Mt 14,22-33", "bio": "De madrugada, Jesus vai ao encontro do barco andando sobre o mar. Pedro pede para ir até ele, anda sobre a água, mas sente medo e começa a afundar. Jesus lhe estende a mão: “Homem de pouca fé, por que duvidaste?”", "why": "Jesus de pé sobre as ondas, fora do barco, segura a mão de Pedro, que afunda.", "serie": "novotestamento", "grupo": "mar", "rec": [0.3, 0.45, 0.28], "q": {"t": "O que os discípulos pensaram ao ver Jesus?", "c": "Que era um fantasma", "e": ["Que era Elias", "Que era João Batista", "Que era um pescador"], "ref": "Mt 14,26"}, "frases": [{"t": "Homem de pouca fé, por que duvidaste?", "ref": "Mt 14,31"}]}, {"id": "nttransfiguracao", "name": "Transfiguração", "feast": "Mt 17,1-9", "bio": "Jesus sobe a um monte com Pedro, Tiago e João. Ali seu rosto brilha como o sol e suas roupas ficam brancas como a luz. Aparecem Moisés e Elias, e uma voz diz: “Este é o meu Filho amado, escutai-o”.", "why": "Jesus resplandecente no alto do monte, entre Moisés, com as tábuas, e Elias. Os três apóstolos caem por terra.", "serie": "novotestamento", "grupo": "inicio", "rec": [0.3, 0.62, 0.34], "q": {"t": "Que apóstolos Jesus levou consigo à montanha?", "c": "Pedro, Tiago e João", "e": ["Pedro, André e Filipe", "João, Tomé e Mateus", "Os doze"], "ref": "Mt 17,1"}, "frases": [{"t": "Senhor, é bom estarmos aqui. Se queres, farei aqui três tendas.", "ref": "Mt 17,4"}]}, {"id": "ntramos", "name": "Entrada em Jerusalém", "feast": "Mt 21,1-11", "bio": "Jesus entra em Jerusalém montado num jumento. A multidão estende mantos e ramos pelo caminho e grita: “Hosana ao Filho de Davi!” É o Domingo de Ramos.", "why": "Jesus montado num jumento, e o povo com os ramos de palmeira e os mantos estendidos no chão.", "serie": "novotestamento", "grupo": "paixao", "rec": [0.3, 0.66, 0.32], "q": {"t": "O que a cidade inteira perguntava, alvoroçada, quando Jesus entrou?", "c": "“Quem é este?”", "e": ["“De onde ele vem?”", "“Onde está o rei?”", "“Por que tanto barulho?”"], "ref": "Mt 21,10"}, "frases": [{"t": "Hosana ao filho de Davi! Bendito seja aquele que vem em nome do Senhor!", "ref": "Mt 21,9"}]}, {"id": "ntsamaritano", "name": "Bom Samaritano", "feast": "Lc 10,25-37", "bio": "Jesus conta a parábola de um homem assaltado e largado na estrada. Um sacerdote e um levita passam ao largo. Um samaritano, estrangeiro, para, cuida das feridas e o leva a uma hospedaria. “Vai e faze o mesmo.”", "why": "O samaritano trata as feridas do homem caído, com o jumento ao lado. Ao longe vão embora o sacerdote e o levita, que não pararam.", "serie": "novotestamento", "grupo": "encontros", "rec": [0.3, 0.52, 0.3], "q": {"t": "De onde para onde descia o homem que caiu nas mãos dos ladrões?", "c": "De Jerusalém a Jericó", "e": ["De Nazaré a Belém", "De Jerusalém a Emaús", "De Cafarnaum a Caná"], "ref": "Lc 10,30"}, "frases": [{"t": "Vai, e faze tu o mesmo.", "ref": "Lc 10,37"}]}, {"id": "ntprodigo", "name": "Filho Pródigo", "feast": "Lc 15,11-32", "bio": "Na parábola, o filho mais novo pede a herança, gasta tudo e passa fome. Volta arrependido, e o pai corre ao seu encontro, abraça-o e }, {"id": "ntsamaritana", "name": "Samaritana no poço", "feast": "Jo 4,1-42", "bio": "Cansado da viagem, Jesus senta-se junto ao poço de Jacó e pede água a uma mulher samaritana. Fala-lhe da água viva, e ela corre a chamar o povo da cidade.", "why": "Jesus sentado à beira do poço, conversando com a mulher do cântaro, ao meio-dia.", "serie": "novotestamento", "grupo": "encontros", "rec": [0.45, 0.4, 0.32], "q": {"t": "De quem era o poço à beira do qual Jesus se sentou?", "c": "De Jacó", "e": ["De Abraão", "De Davi", "De Moisés"], "ref": "Jo 4,6"}, "frases": [{"t": "O que beber da água que eu lhe der jamais terá sede.", "ref": "Jo 4,14"}]}, {"id": "ntlazaro", "name": "Ressurreição de Lázaro", "feast": "Jo 11,1-44", "bio": "Lázaro, amigo de Jesus, está morto há quatro dias. Jesus chora, manda tirar a pedra e grita: “Lázaro, vem para fora!” O morto sai, ainda enrolado nas faixas.", "why": "Lázaro sai do túmulo, enrolado nas faixas, ao chamado de Jesus. As duas mulheres ajoelhadas são suas irmãs, Marta e Maria.", "serie": "novotestamento", "grupo": "curas", "rec": [0.1, 0.48, 0.34], "q": {"t": "Havia quantos dias Lázaro estava no sepulcro quando Jesus chegou?", "c": "Quatro dias", "e": ["Um dia", "Três dias", "Sete dias"], "ref": "Jo 11,17"}, "frases": [{"t": "Jesus pôs-se a chorar.", "ref": "Jo 11,35"}]}, {"id": "ntcego", "name": "Cura do cego", "feast": "Mc 10,46-52", "bio": "À saída de Jericó, o cego Bartimeu grita: “Filho de Davi, tem piedade de mim!” Jesus manda chamá-lo; ele larga o manto, e Jesus lhe diz: “Vai, a tua fé te salvou”. Na mesma hora volta a ver.", "why": "Jesus toca os olhos do cego ajoelhado à beira do caminho. O manto no chão é o que Bartimeu largou para ir até ele.", "serie": "novotestamento", "grupo": "curas", "rec": [0.4, 0.62, 0.32], "q": {"t": "Como se chamava o cego que mendigava à saída de Jericó?", "c": "Bartimeu", "e": ["Nicodemos", "Malco", "Jairo"], "ref": "Mc 10,46"}, "frases": [{"t": "Jesus, filho de Davi, tem compaixão de mim!", "ref": "Mc 10,47"}]}, {"id": "ntparalitico", "name": "Paralítico descido pelo telhado", "feast": "Mc 2,1-12", "bio": "A casa está tão cheia que quatro homens abrem o telhado e descem um paralítico até Jesus. Vendo a fé deles, Jesus perdoa os pecados do homem e o manda levantar-se e levar a maca.", "why": "O paralítico desce na maca, pelas cordas, pelo buraco aberto no telhado, até diante de Jesus.", "serie": "novotestamento", "grupo": "curas", "rec": [0.3, 0.05, 0.34], "q": {"t": "Em que cidade isso aconteceu?", "c": "Cafarnaum", "e": ["Jericó", "Betânia", "Nazaré"], "ref": "Mc 2,1"}, "frases": [{"t": "Filho, perdoados te são os pecados.", "ref": "Mc 2,5"}]}, {"id": "ntlavapes", "name": "Lava-pés", "feast": "Jo 13,1-15", "bio": "Durante a ceia, Jesus se levanta, amarra uma toalha na cintura e lava os pés dos discípulos, serviço de escravo. “Se eu, o Senhor e Mestre, vos lavei os pés, também deveis lavar os pés uns dos outros.”", "why": "Jesus de joelhos, com a toalha na cintura, lava os pés de Pedro numa bacia.", "serie": "novotestamento", "grupo": "paixao", "rec": [0.35, 0.62, 0.34], "q": {"t": "Qual apóstolo, de início, não quis que Jesus lhe lavasse os pés?", "c": "Pedro", "e": ["João", "Judas", "Tomé"], "ref": "Jo 13,8"}, "frases": [{"t": "Dei-vos o exemplo para que, como eu vos fiz, assim façais também vós.", "ref": "Jo 13,15"}]}, {"id": "nthorto", "name": "Agonia no Horto", "feast": "Lc 22,39-46", "bio": "Depois da ceia, Jesus vai rezar no monte das Oliveiras. Cheio de angústia, pede: “Pai, afasta de mim este cálice; mas não se faça a minha vontade, e sim a tua”. Os discípulos dormem.", "why": "Jesus reza de joelhos, de noite, entre as oliveiras, e um anjo lhe mostra o cálice. Os três apóstolos dormem, e ao longe já vêm os soldados com tochas.", "serie": "novotestamento", "grupo": "paixao", "rec": [0.15, 0.62, 0.34], "q": {"t": "Para que monte Jesus foi depois da ceia?", "c": "O monte das Oliveiras", "e": ["O monte Tabor", "O monte Sinai", "O monte Carmelo"], "ref": "Lc 22,39"}, "frases": [{"t": "Pai, se é de teu agrado, afasta de mim este cálice! Não se faça, todavia, a minha vontade, mas sim a tua.", "ref": "Lc 22,42"}]}, {"id": "ntadultera", "name": "Mulher adúltera", "feast": "Jo 8,1-11", "bio": "Trazem a Jesus uma mulher apanhada em adultério e querem apedrejá-la. Ele escreve no chão e diz: “Quem não tiver pecado atire a primeira pedra”. Todos vão embora. “Nem eu te condeno. Vai e não peques mais.”", "why": "Jesus abaixado, escrevendo no chão com o dedo, ao lado da mulher. Os acusadores largam as pedras e vão embora.", "serie": "novotestamento", "grupo": "encontros", "rec": [0.4, 0.68, 0.3], "q": {"t": "Quem foram os primeiros a se retirar?", "c": "Os mais idosos", "e": ["Os mais jovens", "Os soldados", "Os discípulos"], "ref": "Jo 8,9"}, "frases": [{"t": "Quem de vós estiver sem pecado, seja o primeiro a lhe atirar uma pedra.", "ref": "Jo 8,7"}]}, {"id": "ntvendilhoes", "name": "Expulsão dos vendilhões", "feast": "Jo 2,13-22", "bio": "Jesus encontra o Templo cheio de vendedores de bois, ovelhas e pombas, e de cambistas. Faz um chicote de cordas, expulsa todos e vira as mesas: “Não façais da casa de meu Pai uma casa de comércio”.", "why": "Jesus, com o chicote de cordas, vira as mesas dos cambistas. As moedas rolam pelo chão, e os vendedores fogem com os animais.", "serie": "novotestamento", "grupo": "inicio", "rec": [0.25, 0.58, 0.32], "q": {"t": "Em quantos dias Jesus disse que reergueria o templo?", "c": "Três dias", "e": ["Sete dias", "Quarenta dias", "Um dia"], "ref": "Jo 2,19"}, "frases": [{"t": "Tirai isto daqui e não façais da casa de meu Pai uma casa de negociantes.", "ref": "Jo 2,16"}]}, {"id": "ntnegacao", "name": "Negação de Pedro", "feast": "Lc 22,54-62", "bio": "Depois da prisão de Jesus, Pedro o segue de longe e se aquece junto ao fogo, no pátio. Por três vezes dizem que ele é discípulo, e por três vezes ele nega. O galo canta, Jesus olha para ele, e Pedro sai e chora.", "why": "Pedro, junto ao fogo, nega c   const linkZap = texto => "https://wa.me/?text=" + encodeURIComponent(mensagemZap(texto));
  const botaoZap = (texto, rotulo, id) =>
    `<a class="btn zap" id="${id}" href="${linkZap(texto)}" target="_blank" rel="noopener" data-texto="${texto}">${ZAP_SVG}<span>${rotulo}</span></a>`;
  // No celular, o wa.me pode cair direto na última conversa aberta. Ali o botão abre o menu de compartilhar do aparelho:
  // a pessoa toca no WhatsApp e escolhe para quem mandar. No computador, segue o wa.me (o WhatsApp Web pergunta o contato).
  document.addEventListener("click", e => {
    const a = e.target.closest?.("a.zap"), nav = window.navigator;
    if (!a || !nav?.share || !window.matchMedia?.("(pointer: coarse)").matches) return;
    e.preventDefault();
    nav.share({ text: mensagemZap(a.dataset.texto) }).catch(err => { if (err?.name !== "AbortError") window.open(a.href, "_blank"); });
  });
  $("convite").innerHTML = botaoZap("Conhece os santos pelos vitrais? Jogue o Quiz dos Santos: veja o vitral e descubra quem é o santo.", "Compartilhar o jogo no WhatsApp", "zap");

  function renderFimEtapa() {
    const col = colecao(st.colecao), n = st.etapa, total = etapas(col).length;
    const errados = [...new Set(st.results.filter(r => !r.ok).map(r => r.id))];
    const jogados = new Set(st.results.map(r => r.id)).size, todos = jogados === st.itens.length;
    const quem = todos ? `${col.os} ${st.itens.length}` : jogados === 1 ? col.faltava : `${col.os} ${jogados} que faltavam`;
    const temProxima = n + 1 < total && situacao(col, n + 1) !== "trancada";
    showArt(itemDe(st.results.at(-1).id));
    $("panel").innerHTML = `<div class="end">
      <div class="eyebrow">Etapa ${n + 1} completa</div>
      <div class="big">${st.itens.length}/${st.itens.length}</div>
      <p class="q">${errados.length ? `Você acertou ${quem} em ${st.results.length} respostas.` : todos ? `${col.todos} de primeira. ${col.elogio}` : `Você acertou ${quem} de primeira.`}</p>
      ${!st.refeita && etapaAberta(col) === -1 ? `<p class="why">Você completou o ${col.nomeMapa}.</p>` : ""}
      ${errados.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Para rever</div><ul class="missed">${[...new Set(errados.map(base))].map(id =>
        `<li><b>${byId[id].name}</b>: ${byId[id].why}</li>`).join("")}</ul></div>` : ""}
      <div class="acoes">${temProxima ? `<button class="btn" id="proxima">Próxima etapa</button>` : ""}<button class="btn" id="vermapa">Ver o mapa</button>
      ${botaoZap(`Completei a etapa ${n + 1} de ${total} do ${col.nomeMapa}, no Quiz dos Santos. Consegue chegar até aqui?`, "Desafiar no WhatsApp", "zap-fim")}</div></div>`;
    const colId = st.colecao, prox = temProxima ? $("proxima") : null;
    $("vermapa").onclick = () => volta(() => abrirMapa(colId));
    if (prox) { prox.onclick = () => jogarEtapa(colId, n + 1); prox.focus(); } else $("vermapa").focus();
  }

  function render() {
    renderNav();
    $("score").hidden = st.tipo === "etapa";
    renderModes();
    const col = st.tipo === "etapa" ? colecao(st.colecao) : COLECOES[0];
    $("cap").textContent = col.legenda ? col.legenda : st.mode === "imagem" ? "Vitral do santo" : "Vitral com os atributos tradicionais do santo";
    renderLevels();
    $("total").textContent = st.order.length;
    $("hits").textContent = st.tipo === "etapa" ? st.certos.length : st.hits;
    $("round").textContent = Math.min(st.i + 1, st.order.length);
    renderDots();
    const panel = $("panel");

    if (st.i >= st.order.length) {
      if (st.tipo === "etapa") { renderFimEtapa(); return; }
      const missed = st.results.filter(r => !r.ok);
      const verdict = st.hits === ROUNDS ? "Perfeito. Você conhece bem a arte sacra." :
        st.hits >= 7 ? "Muito bem. Poucos santos te escaparam." :
        st.hits >= 4 ? "Bom começo. Os símbolos ficam mais fáceis com a prática." : "Os atributos dos santos têm muita história. Vale outra rodada.";
      showArt(byId[st.results.at(-1).id]);
      panel.innerHTML = `<div class="end">
        <div class="eyebrow">Resultado</div>
        <div class="big">${st.hits}/${ROUNDS}</div>
        <p class="q">${verdict}</p>
        ${missed.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Para rever</div><ul class="missed">${missed.map(r =>
          `<li><b>${byId[r.id].name}</b>: ${byId[r.id].why}</li>`).join("")}</ul></div>` : ""}
        <div class="acoes"><button class="btn" id="again">Jogar de novo</button>
        ${botaoZap(`Fiz ${st.hits} de ${ROUNDS} no Quiz dos Santos: veja o vitral e descubra quem é o santo. Consegue fazer mais?`, "Desafiar no WhatsApp", "zap-fim")}</div></div>`;
      $("again").onclick = newGame;
      $("again").focus();
      return;
    }

    const item = st.order[st.i], ans = itemDe(item), certa = st.certa ?? item;
    const tp = st.tipo === "etapa" && col.tipos ? tipoDe(item) : null;
    // Pergunta pelo detalhe: o vitral aparece recortado até a resposta certa; depois, inteiro
    const rec = tp === "detalhe" && st.picked !== certa;
    const art = $("art");
    const key = st.mode + ":" + item + (rec ? ":rec" : "");
    if (art.dataset.id !== key) {
      showArt(ans, rec);
      art.dataset.id = key;
      // Adianta o carregamento da imagem da rodada seguinte
      const prox = st.i + 1 < st.order.length ? imgFor(base(st.order[st.i + 1]), st.mode) : null;
      if (prox && typeof Image !== "undefined") new Image().src = prox;
    }
    const answered = !!st.picked, ok = st.picked === certa;
    // Em etapa do mapa, quem erra não vê a resposta: o santo volta mais adiante e tem de ser acertado
    const segredo = answered && !ok && st.tipo === "etapa";
    $("stage").dataset.longas = tp === "pergunta" || tp === "frase" ? "1" : "";
    const opts = st.opts.map((id, k) => {
      let cls = "";
      if (answered) cls = id === certa && !segredo ? "ok" : id === st.picked ? "bad" : "dim";
      const rotulo = tp === "pergunta" ? (id === "c" ? ans.q.c : ans.q.e[+id]) : tp === "frase" ? `“${fraseDe(id).t}”` : byId[id].curto || byId[id].name;
      return `<button class="opt ${cls}" id="opt-${k}" data-id="${id}" ${answered ? "disabled" : ""}><span class="k">${k + 1}</span><span>${rotulo}</span></button>`;
    }).join("");
    panel.innerHTML = `
      <div class="eyebrow">${st.tipo === "etapa" ? `Etapa ${st.etapa + 1} · ${st.certos.length} de ${st.itens.length}` : `Rodada ${st.i + 1} de ${ROUNDS}`}</div>
      <p class="q">${tp === "pergunta" ? ans.q.t : tp === "frase" ? "Qual destas frases é desta passagem?" : tp === "detalhe" ? col.perguntaDetalhe : col.pergunta || (st.mode === "imagem" ? "Que santo é este?" : "Que santo é representado por estes símbolos?")}</p>
      <p class="hint">${col.dica || "Na arte sacra, cada santo é reconhecido pelos seus atributos: os objetos que contam sua vida ou seu martírio."}</p>
      <div class="opts${tp === "pergunta" || tp === "frase" ? " longas" : ""}">${opts}</div>
      ${segredo ? `<div class="reveal">
        <div class="verdict bad">Não foi dessa vez.</div>
        <p class="why">${col.este} volta mais adiante nesta etapa. Repare bem no vitral.</p>
        <button class="btn" id="next">${col.proximo}</button>
      </div>` : answered ? `<div class="reveal">
        <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Acertou!" : "Não foi dessa vez."}</div>
        <div class="name">${ans.name}</div>
        <div class="feast">${col.rotulo || "Festa"}: ${ans.feast}</div>
        ${tp === "pergunta" ? `<p class="why"><b>Resposta:</b> ${ans.q.c} (${ans.q.ref}).</p>` : tp === "frase" ? `<p class="why"><b>A frase:</b> “${fraseDe(certa).t}” (${fraseDe(certa).ref}, Bíblia Ave-Maria).</p>` : ""}
        <p class="why">${ans.bio}</p>
        <p class="why"><b>No vitral:</b> ${ans.why}</p>
        <button class="btn" id="next">${st.i + 1 < st.order.length ? col.proximo : "Ver resultado"}</button>
      </div>` : ""}`;
    panel.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b.dataset.id));
    const nb = $("next"); if (nb) nb.onclick = next;
  }

  document.addEventListener("keydown", e => {
    if (!st || tela !== "jogo" || e.target.closest && e.target.closest("input,textarea")) return;
    if (st.i < st.order.length && !st.picked && /^[1-4]$/.test(e.key)) pick(st.opts[+e.key - 1]);
  });

  // Jogar sem internet. O sw.js serve o que estiver guardado no aparelho; aqui se guardam as imagens todas de uma vez.
  const CACHE_IMAGENS = "quiz-santos-imagens-v4"; // o mesmo nome que está no sw.js
  const todasImagens = () => [...COM_FIGURA.map(id => arquivo("santos", id)), ...COM_SIMBOLOS.map(id => arquivo("simbolos", id)), ...Object.entries(COM_SERIE).flatMap(([serie, ids]) => ids.map(id => arquivo(serie, id)))];
  const offline = {
    async faltam() {
      const tem = new Set((await (await window.caches.open(CACHE_IMAGENS)).keys()).map(r => r.url.split("/img/")[1]));
      return todasImagens().filter(u => !tem.has(u.slice(4)));
    },
    // Guarda o que falta, seis imagens por vez, e devolve quantas falharam
    async baixar(aviso = () => {}) {
      const cache = await window.caches.open(CACHE_IMAGENS), fila = await offline.faltam(), total = todasImagens().length;
      let feitas = total - fila.length, erros = 0;
      const braco = async () => {
        for (let u; (u = fila.pop());) {
          try { await cache.add(u); feitas++; } catch (e) { erros++; }
          aviso(feitas, total);
        }
      };
      await Promise.all(Array.from({ length: 6 }, braco));
      return erros;
    }
  };
  (async () => {
    const nav = window.navigator, foot = $("foot");
    if (!nav?.serviceWorker || !window.caches || !/^https?:$/.test(window.location.protocol)) return;
    nav.serviceWorker.register("sw.js").catch(() => {});
    const instalado = !!window.matchMedia?.("(display-mode: standalone)").matches || nav.standalone === true;
    let convite = null;
    const mostra = (texto, botao, acao) => {
      foot.innerHTML = `<span>${texto}</span>${botao ? `<button class="lvl" type="button">${botao}</button>` : ""}`;
      const b = botao && foot.querySelector("button");
      if (b) b.onclick = acao;
    };
    const pronto = () => convite
      ? mostra("Pronto para jogar sem internet.", "Instalar como aplicativo", () => { convite.prompt(); convite = null; pronto(); })
      : mostra(instalado ? "Pronto para jogar sem internet." : "Pronto para jogar sem internet. Para virar aplicativo, abra o menu do navegador e toque em “Adicionar à tela inicial”.");
    const guardar = async () => {
      try { localStorage.setItem("quiz-santos-offline", "1"); } catch (e) {}
      nav.storage?.persist?.().catch(() => {});
      const erros = await offline.baixar((f, t) => mostra(`Guardando as imagens: ${f} de ${t}`));
      if (erros) mostra(`Faltou guardar ${erros} ${erros === 1 ? "imagem" : "imagens"}. Confira a internet.`, "Tentar de novo", guardar);
      else pronto();
    };
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); convite = e; if (foot.textContent.startsWith("Pronto")) pronto(); });
    try {
      const faltam = (await offline.faltam()).length;
      let pedido = instalado;
      try { pedido = pedido || localStorage.getItem("quiz-santos-offline") === "1"; } catch (e) {}
      if (!faltam) pronto();
      else if (pedido) guardar(); // quem já pediu, ou instalou, recebe sozinho as imagens novas
      else mostra("Quer jogar sem internet? As imagens ficam guardadas no aparelho (cerca de 51 MB).", "Guardar para jogar sem internet", guardar);
    } catch (e) {}
  })();

  window.addEventListener?.("popstate", ev => {
    const e = ev.state;
    if (e?.quiz === "mapa") abrirMapa(e.col);
    else if (e?.quiz === "jogo" && st) { mostrar("jogo"); render(); }
    else abrirInicio();
  });

  // Gancho para os testes (testes/verifica.js e testes/teste.html)
  window.__quiz = { SAINTS, SENHORAS, COM_SENHORA, PASSAGENS, COM_SERIE, base, tipoDe, parecidas, LEVELS, MODES, COM_FIGURA, COM_SIMBOLOS, ativo, poolFor, levelOf, wrongFor, imgFor, artFor, windowSVG, offline, dealOrder, ORDEM, COLECOES, colecao, itensDe, etapas, acertados, marcarAcerto, zerarMapa, etapaAberta, situacao, jogarEtapa, jogoLivre, abrirInicio, abrirMapa, mostrar, tela: () => tela, state: () => st, mode: () => mode, setLevel, setMode, pick, next };

  function start(data) {
    if (data && data.st && Array.isArray(data.st.order)) {
      st = data.st; if (st.level) level = st.level;
      if (!MODES.some(m => m[0] === st.mode)) st.mode = "simbolos";
      mode = st.mode; mostrar("jogo"); render();
    }
    else {
      // Página recarregada no meio do jogo: o histórico pode ter ficado numa tela que não existe mais
      try { window.history?.replaceState?.(null, ""); } catch (e) {}
      abrirInicio();
    }
  }
  window.claude?.hot?.snapshot?.(() => ({ st }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
