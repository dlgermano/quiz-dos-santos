<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz dos Santos</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a2030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" crossorigin>
<style>
/* Layout: a stained-glass window on the left, the question and choices on the right; stacks on phones */
:root {
  --bg: #e4e8ee;
  --surface: #f4f6f9;
  --fg: #1a2030;
  --muted: #5a6478;
  --line: #c9d0db;
  --accent: #8a5d0c;
  --ok: #1f7a45;
  --ok-bg: #dcf0e3;
  --bad: #b3261e;
  --bad-bg: #f7dedb;
  --display: "Uncial Antiqua", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #161d2e; --fg: #ebe5d8; --muted: #9aa3b6; --line: #2a3349;
    --accent: #e3b44c; --ok: #6fd39a; --ok-bg: #133524; --bad: #f08a80; --bad-bg: #3e1a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2e; --fg: #ebe5d8; --muted: #9aa3b6; --line: #2a3349;
  --accent: #e3b44c; --ok: #6fd39a; --ok-bg: #133524; --bad: #f08a80; --bad-bg: #3e1a18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* O jogo decide onde a página fica ao trocar de rodada: o navegador não deve segurar a rolagem no que sumiu */
html { overflow-anchor: none; }
/* O atributo hidden precisa vencer o display das telas (grid, flex) */
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 2rem; margin: 0; text-wrap: balance; }
.score { font-variant-numeric: tabular-nums; color: var(--muted); display: flex; gap: 16px; }
.score b { color: var(--fg); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.bad { background: var(--bad); border-color: var(--bad); }
.dot.now { border-color: var(--accent); border-width: 2.5px; }

.levels { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.lvl {
  font: inherit; font-size: .92rem; cursor: pointer; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 14px;
}
.lvl span { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; margin-left: 2px; }
.lvl[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.lvl[aria-pressed="true"] span { color: var(--bg); opacity: .8; }
.foot { color: var(--muted); font-size: .92rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.foot:empty { display: none; }
.foot .lvl { min-height: 44px; }
.lvl:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.levels:empty { display: none; }
.muted { color: var(--muted); font-size: .92rem; }
/* Início: uma carta por coleção e, embaixo, o jogo livre */
.inicio { display: grid; gap: 12px; width: 100%; max-width: 520px; margin: 0 auto; }
.cartas { display: grid; gap: 10px; }
.carta {
  font: inherit; color: var(--fg); text-align: left; cursor: pointer; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
.carta:hover { border-color: var(--accent); }
.carta:focus-visible, .casa:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.carta .txt { display: grid; gap: 2px; }
.carta .nome { font-family: var(--display); font-size: 1.15rem; line-height: 1.2; }
.barra { display: block; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
.barra i { display: block; height: 100%; background: var(--accent); }
.livre { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.livre .lvl, .topo .lvl, .zerar .lvl { min-height: 44px; }
.zerar { display: flex; justify-content: center; margin-top: 20px; }
/* Arco de vitral: miniatura das cartas e das etapas. O número fica por baixo da imagem e aparece se ela não carregar */
.arco {
  position: relative; display: grid; place-items: center; aspect-ratio: 3 / 4; overflow: hidden; border: 2.5px solid #231d1a;
  border-radius: 50% 50% 6px 6px / 38% 38% 6px 6px; background: var(--line); font-family: var(--display); font-size: 1.3rem; color: var(--muted);
}
.arco img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* Mapa: trilha de etapas em zigue-zague, de cima para baixo */
.mapa { width: 100%; max-width: 420px; margin: 0 auto; }
.topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mapa h2 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 8px 0 0; }
.trilha { position: relative; margin-top: 10px; }
.trilha svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.trilha path { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 12; vector-effect: non-scaling-stroke; }
.casa {
  font: inherit; font-size: .8rem; line-height: 1.2; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer;
  position: absolute; width: 96px; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; text-align: center;
}
.casa .arco { width: 62px; }
.casa.completa { color: var(--fg); }
.casa.aberta { color: var(--accent); font-weight: 700; }
.casa.aberta .arco { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); }
.casa.aberta .arco img { filter: grayscale(1) opacity(.45); }
/* o número fica sob a imagem só como reserva; com a imagem translúcida ele apareceria por cima do vitral */
.casa.aberta .arco:has(img) { color: transparent; }
.casa.trancada { cursor: default; }
.volta {
  position: absolute; right: 0; font: inherit; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700;
  background: none; border: 1.5px solid var(--accent); border-radius: 999px; padding: 0 12px; min-height: 36px; cursor: pointer;
}
.casa.trancada .arco { border-color: var(--muted); opacity: .7; }
/* Tela larga e deitada: vitral à esquerda, do tamanho que couber na altura da tela */
.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: start; }
.window { width: min(100%, 360px, calc((100dvh - 230px) * .75)); min-width: 150px; margin: 0 auto; }
/* Quadro em 3:4 fixo, para a página não pular enquanto a imagem carrega */
#art { aspect-ratio: 3 / 4; display: grid; place-items: center; }
#art svg, #art img { display: block; height: 100%; width: auto; max-width: 100%; filter: drop-shadow(0 8px 22px rgba(0,0,0,.32)); }
#art img { object-fit: contain; border-radius: 6px; }
/* Recorte de um vitral (pergunta pelo detalhe): a mesma imagem, ampliada e deslocada dentro de um quadro 3:4 */
#art .recorte { position: relative; overflow: hidden; height: 100%; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 6px; filter: drop-shadow(0 8px 22px rgba(0,0,0,.32)); }
#art .recorte img { position: absolute; height: auto; max-width: none; border-radius: 0; filter: none; }
/* Tela estreita ou de pé (celular, tablet em pé): vitral em cima, o maior que couber deixando
   espaço para a pergunta e as 4 opções, e opções em duas colunas */
@media (max-width: 720px), (orientation: portrait) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .window { width: min(100%, 520px, calc((100dvh - 370px) * .75)); min-width: min(100%, 190px); }
  .hint, .window .cap { display: none; }
  .q { font-size: 1.2rem; }
  .panel { gap: 12px; }
  .opts { grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { font-size: 1rem; padding: 9px 12px; min-height: 52px; line-height: 1.25; }
  .opt .k { display: none; }
  /* Respostas e frases ocupam mais linhas: o vitral cede altura para as 4 caberem na tela */
  .stage[data-longas="1"] .window { width: min(100%, 520px, calc((100dvh - 560px) * .75)); min-width: 105px; }
  .stage[data-longas="1"] .q { font-size: 1.08rem; }
  .stage[data-longas="1"] .panel { gap: 8px; }
  .opts.longas { gap: 6px; }
  .opts.longas .opt { font-size: .93rem; line-height: 1.22; padding: 7px 10px; min-height: 44px; }
}
/* Tela pequena em largura ou em altura: cabeçalho enxuto */
@media (max-width: 720px), (max-height: 520px) {
  .wrap { padding: 12px 12px 24px; gap: 12px; }
  header { gap: 6px 10px; align-items: center; justify-content: flex-start; }
  h1 { font-size: 1.4rem; }
  .score { display: none; }
  .levels { width: auto; gap: 5px; }
  .lvl { font-size: .85rem; padding: 4px 10px; }
  .lvl span { display: none; }
  #modes { order: 1; } #levels { order: 2; } .dots { order: 3; }
}
@media (max-width: 720px) { .dots { width: 100%; } }
/* Celular deitado: quase toda a altura vai para o vitral */
@media (min-width: 721px) and (max-height: 520px) and (orientation: landscape) {
  .window { width: calc((100dvh - 84px) * .75); }
  .hint, .window .cap { display: none; }
  .stage { gap: 20px; }
}
.window .cap { text-align: center; font-size: .85rem; color: var(--muted); margin-top: 8px; }

.panel { display: grid; gap: 16px; min-width: 0; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.q { font-size: 1.45rem; font-weight: 500; margin: 0; text-wrap: balance; line-height: 1.25; }
.hint { color: var(--muted); margin: 0; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* Respostas e frases são mais longas que um nome: uma coluna só */
.opts.longas { grid-template-columns: 1fr; }
.opts.longas .opt { font-size: .98rem; line-height: 1.3; min-height: 46px; }
.opt {
  font: inherit; font-size: 1.05rem; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 14px; display: flex; gap: 10px; align-items: center; min-height: 54px;
  transition: border-color .15s, transform .1s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: translateY(1px); }
.opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .k { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; flex: none; }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt.dim { opacity: .55; }

.reveal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.name { font-family: var(--display); font-size: 1.5rem; line-height: 1.2; }
.feast { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.why { margin: 0; max-width: 62ch; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer; justify-self: start;
  background: var(--accent); color: var(--bg); border: none; border-radius: 10px; padding: 11px 20px;
}
.end { display: grid; gap: 14px; }
.end .acoes { display: flex; flex-wrap: wrap; gap: 10px; }
/* Compartilhar o jogo pelo WhatsApp: verde do WhatsApp, com texto escuro para dar contraste nos dois temas */
.zap { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: #25d366; color: #0b2e17; }
.zap svg { width: 20px; height: 20px; flex: none; }
.convite { display: flex; justify-content: center; }
.convite .zap { min-height: 44px; }
.big { font-family: var(--display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.missed { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.missed li { max-width: 62ch; }
@media (prefers-reduced-motion: no-preference) {
  #art .in { animation: glow .5s ease-out; }
  @keyframes glow { from { opacity: .35; transform: scale(.985); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Quiz dos Santos</h1>
    <div class="score" id="score" hidden><span>Rodada <b id="round">1</b>/<span id="total">10</span></span><span>Acertos <b id="hits">0</b></span></div>
    <div class="dots" id="dots" aria-hidden="true" hidden></div>
    <div class="levels" id="nav" role="group" aria-label="Voltar" hidden></div>
    <div class="levels" id="modes" role="group" aria-label="Modo de jogo" hidden></div>
    <div class="levels" id="levels" role="group" aria-label="Nível" hidden></div>
  </header>

  <section class="inicio" id="inicio" hidden></section>
  <section class="mapa" id="mapa" hidden></section>

  <main class="stage" id="stage" hidden>
    <div class="window">
      <div id="art"></div>
      <div class="cap" id="cap"></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <footer class="foot" id="foot" aria-live="polite"></footer>
  <div class="convite" id="convite"></div>
</div>

<script>
(() => {
  const L = "#231d1a";
  const C = {
    gold: "#e9b949", silver: "#d3dbe1", iron: "#6f777d", red: "#c4302b", green: "#4f9a4a", dkgreen: "#2f6b3a",
    white: "#f6f0e1", brown: "#8a5a32", dkbrown: "#5b3a22", blue: "#3d6fb6", skin: "#f0c9a0", orange: "#ef8a2c",
    yellow: "#ffd84a", black: "#2e2a2a", stone: "#cdbb9e", wood: "#c99a5b"
  };
  const g = (t, s) => `<g transform="${t}">${s}</g>`;
  const lineL = (x1, y1, x2, y2, c, w) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${L}" stroke-width="${w + 5}"/>` +
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
  const pathL = (d, c, w) =>
    `<path d="${d}" fill="none" stroke="${L}" stroke-width="${w + 5}"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;

  // ---------- Attributes ----------
  const key = c => `<rect x="-5" y="-30" width="10" height="92" fill="${c}"/>
    <rect x="5" y="34" width="20" height="10" fill="${c}"/><rect x="5" y="50" width="14" height="10" fill="${c}"/>
    <circle cx="0" cy="-48" r="20" fill="${c}"/><circle cx="0" cy="-48" r="8" fill="${L}"/>`;

  const sword = (blade = C.silver, hilt = C.gold) => `<polygon points="-7,40 -7,-62 0,-84 7,-62 7,40" fill="${blade}"/>
    <line x1="0" y1="-60" x2="0" y2="36" stroke-width="1.5"/>
    <rect x="-30" y="38" width="60" height="10" rx="3" fill="${hilt}"/>
    <rect x="-5" y="48" width="10" height="28" fill="${C.dkbrown}"/><circle cx="0" cy="82" r="8" fill="${hilt}"/>`;

  const openBook = (cover = C.red) => {
    let lines = "";
    for (let i = 0; i < 4; i++) {
      const y = -12 + i * 10;
      lines += `<path d="M-48,${y} Q-26,${y - 8} -8,${y + 2}" fill="none" stroke-width="1.4"/>`;
      lines += `<path d="M48,${y} Q26,${y - 8} 8,${y + 2}" fill="none" stroke-width="1.4"/>`;
    }
    return `<path d="M-60,-22 L-60,36 Q-30,28 0,40 Q30,28 60,36 L60,-22 Z" fill="${cover}"/>
      <path d="M0,-22 Q-28,-34 -56,-26 L-56,30 Q-28,22 0,34 Z" fill="${C.white}"/>
      <path d="M0,-22 Q28,-34 56,-26 L56,30 Q28,22 0,34 Z" fill="${C.white}"/>${lines}`;
  };

  const closedBook = c => `<rect x="-52" y="-14" width="104" height="30" rx="4" fill="${c}"/>
    <rect x="-46" y="-6" width="96" height="12" fill="${C.white}"/>
    <line x1="-40" y1="0" x2="44" y2="0" stroke-width="1.2"/>`;

  const child = () => `<circle cx="0" cy="-30" r="18" fill="${C.gold}"/>
    <path d="M-17,26 Q-20,-10 0,-14 Q20,-10 17,26 Z" fill="${C.white}"/>
    <circle cx="0" cy="-28" r="11" fill="${C.skin}"/>
    <path d="M-14,0 Q-24,-6 -22,-16" fill="none" stroke-width="5"/><path d="M-14,0 Q-24,-6 -22,-16" fill="none" stroke="${C.skin}" stroke-width="2"/>`;

  const blossom = (x, y, s = 1) => g(`translate(${x},${y}) scale(${s})`,
    [-34, 0, 34].map(a => `<ellipse cx="0" cy="-13" rx="5.5" ry="13" transform="rotate(${a})" fill="${C.white}"/>`).join("") +
    `<circle cx="0" cy="-3" r="3.5" fill="${C.yellow}"/>`);
  const lily = (h = 150) =>
    pathL(`M0,0 Q5,${-h / 2} 0,${-h + 6}`, C.green, 4) +
    `<ellipse cx="-12" cy="${-h * 0.3}" rx="15" ry="5" transform="rotate(-30 -12 ${-h * 0.3})" fill="${C.green}"/>
     <ellipse cx="13" cy="${-h * 0.5}" rx="15" ry="5" transform="rotate(30 13 ${-h * 0.5})" fill="${C.green}"/>` +
    pathL(`M2,${-h * 0.62} Q-10,${-h * 0.72} -15,${-h + 34}`, C.green, 3) +
    pathL(`M2,${-h * 0.7} Q12,${-h * 0.78} 15,${-h + 26}`, C.green, 3) +
    blossom(0, -h + 6) + blossom(-15, -h + 34, .85) + blossom(15, -h + 26, .85);

  const rose = () => `<ellipse cx="-12" cy="8" rx="9" ry="4" transform="rotate(25 -12 8)" fill="${C.green}"/>
    <ellipse cx="12" cy="8" rx="9" ry="4" transform="rotate(-25 12 8)" fill="${C.green}"/>
    <circle r="13" fill="${C.red}"/><path d="M-6,-1 Q0,-9 6,-1 Q4,6 -3,4 Q-2,-1 2,-1" fill="none" stroke-width="2"/>`;

  const arrow = (len = 120) => lineL(0, 0, len, 0, C.brown, 3) +
    `<polygon points="${len},-8 ${len + 22},0 ${len},8" fill="${C.silver}"/>
     <polygon points="4,0 -10,-11 12,-11 22,0" fill="${C.red}"/><polygon points="4,0 -10,11 12,11 22,0" fill="${C.red}"/>`;

  const palm = () => `<path d="M0,0 Q18,-60 2,-124 Q-28,-62 0,0 Z" fill="${C.green}"/>
    <path d="M0,0 Q-4,-60 2,-124" fill="none" stroke-width="2"/>` +
    [-100, -80, -60, -40, -20].map(y => `<path d="M${-1 + y * 0.01},${y} l-12,-10 M${y * 0.01},${y} l10,-12" fill="none" stroke-width="1.4"/>`).join("");

  const eyePlate = () => `<ellipse cx="0" cy="8" rx="58" ry="18" fill="${C.gold}"/>
    <ellipse cx="0" cy="4" rx="44" ry="11" fill="#f3d683"/>` +
    [-18, 18].map(x => `<path d="M${x - 15},-2 Q${x},-15 ${x + 15},-2 Q${x},11 ${x - 15},-2 Z" fill="${C.white}"/>
      <circle cx="${x}" cy="-2" r="5.5" fill="${C.blue}"/><circle cx="${x}" cy="-2" r="2" fill="${L}"/>`).join("");

  const wheel = (r) => {
    let s = "";
    for (let i = 0; i < 14; i++) s += `<polygon points="-6,${-r + 2} 0,${-r - 17} 6,${-r + 2}" transform="rotate(${i * 360 / 14})" fill="${C.silver}"/>`;
    for (let i = 0; i < 6; i++) s += `<rect x="-4" y="${-(r - 4)}" width="8" height="${r - 4}" transform="rotate(${i * 60})" fill="${C.brown}"/>`;
    // rim as a ring with a break on the right
    s += `<path d="M${r - 6},-12 A${r - 6},${r - 6} 0 1 0 ${r - 6},12" fill="none" stroke="${L}" stroke-width="17"/>
      <path d="M${r - 6},-12 A${r - 6},${r - 6} 0 1 0 ${r - 6},12" fill="none" stroke="${C.brown}" stroke-width="11"/>`;
    return s + `<circle r="10" fill="${C.gold}"/>`;
  };

  const crown = () => `<polygon points="-30,12 -30,-10 -17,2 0,-20 17,2 30,-10 30,12" fill="${C.gold}"/>
    <rect x="-30" y="6" width="60" height="10" fill="${C.gold}"/>

      draw: () => g("translate(196,190) scale(1.1)", bell()) + g("translate(130,286) scale(1.15)", pig()) },
    { id: "teresacalcuta", name: "Santa Teresa de Calcutá", feast: "5 de setembro", hue: 212,
      why: "O sári branco com três listras azuis, hábito das Missionárias da Caridade, que fundou para servir os mais pobres em Calcutá, e o terço.",
      draw: () => g("translate(138,236) scale(1.2)", sari()) + g("translate(212,264) scale(.75)", rosary()) },
    { id: "kolbe", name: "São Maximiliano Kolbe", feast: "14 de agosto", hue: 4,
      why: "As duas coroas, branca (pureza) e vermelha (martírio), que Maria lhe ofereceu numa visão quando criança, e o uniforme listrado de Auschwitz, onde deu a vida no lugar de um pai de família. 16670 era o seu número de prisioneiro.",
      draw: () => g("translate(116,172) scale(.95)", crownC(C.white)) + g("translate(186,172) scale(.95)", crownC(C.red)) + g("translate(150,268) scale(1.2)", stripedCloth()) },
    { id: "ferrer", name: "São Vicente Férrer", feast: "5 de abril", hue: 250,
      why: "A trombeta do Juízo Final: pregador dominicano que percorreu a Europa chamando à conversão, era chamado de “anjo do Apocalipse”.",
      draw: () => g("translate(140,214) rotate(-14) scale(1.05)", trumpet()) + g("translate(150,310) scale(.8)", openBook(C.dkbrown)) },
    { id: "bakhita", name: "Santa Josefina Bakhita", feast: "8 de fevereiro", hue: 176,
      why: "As correntes partidas: escravizada na infância no Sudão, foi libertada e se tornou religiosa canossiana na Itália. É padroeira das vítimas do tráfico humano.",
      draw: () => g("translate(150,226) scale(1.05)", brokenChains()) + g("translate(150,300) scale(.9)", cross(C.wood, 70, 44, 9)) },
    { id: "eloi", name: "Santo Elói", feast: "1º de dezembro", hue: 18,
      why: "A bigorna, o martelo e a ferradura: foi ourives e ferreiro antes de ser bispo de Noyon. É padroeiro dos ourives, ferreiros e metalúrgicos.",
      draw: () => g("translate(140,282) scale(1.15)", anvil()) + g("translate(108,186) rotate(-35)", hammer()) + g("translate(196,190) scale(1.1)", horseshoe()) },
    { id: "huberto", name: "Santo Huberto", feast: "3 de novembro", hue: 120,
      why: "O veado com uma cruz luminosa entre os chifres, que lhe apareceu numa caçada e o converteu. É padroeiro dos caçadores.",
      draw: () => g("translate(150,262) scale(1.25)", stag()) },
    { id: "goncalo", name: "São Gonçalo de Amarante", feast: "10 de janeiro", hue: 330,
      why: "A viola: conta a tradição popular que tocava e dançava para afastar as pessoas do pecado. No Brasil, é lembrado nas danças de São Gonçalo e invocado como santo casamenteiro.",
      draw: () => g("translate(150,250) rotate(-24) scale(1.05)", viola()) },
    { id: "galvao", name: "São Frei Galvão", feast: "25 de outubro", hue: 200,
      why: "As pílulas de papel com uma oração a Nossa Senhora, distribuídas até hoje no Mosteiro da Luz, em São Paulo. Foi o primeiro santo nascido no Brasil.",
      draw: () => g("translate(150,206) scale(1.1)", paperSheet()) +
        [[100, 292, 20], [132, 304, -10], [166, 296, 35], [198, 306, -25], [120, 326, 5], [180, 330, 15]].map(([x, y, a]) => g(`translate(${x},${y}) rotate(${a})`, paperPill())).join("") },
    { id: "anchieta", name: "São José de Anchieta", feast: "9 de junho", hue: 190,
      why: "A pena escrevendo na areia: compôs na praia de Iperoig um longo poema à Virgem Maria, guardando os versos de memória. Jesuíta, é chamado de Apóstolo do Brasil.",
      draw: () => g("translate(150,176)", waves(100, 2)) + g("translate(150,236)", sand()) + g("translate(176,224) rotate(25)", quill()) },
    { id: "isidoro", name: "Santo Isidoro Lavrador", feast: "15 de maio", hue: 78,
      why: "O arado e o feixe de trigo: era lavrador em Madri, e conta-se que os anjos aravam por ele enquanto rezava. É padroeiro dos agricultores.",
      draw: () => g("translate(132,290)", plough()) + g("translate(196,206) scale(1.1)", wheat()) },
    { id: "bartolomeu", name: "São Bartolomeu", feast: "24 de agosto", hue: 356,
      why: "A faca curva de esfolar, instrumento do seu martírio, e o livro do apóstolo. Os Evangelhos também o chamam de Natanael.",
      draw: () => g("translate(150,206) rotate(-10) scale(1.2)", curvedKnife()) + g("translate(150,296) scale(.95)", openBook(C.red)) },
    { id: "madalena", name: "Santa Maria Madalena", feast: "22 de julho", hue: 340,
      why: "O vaso de alabastro com o perfume com que, segundo a tradição, ungiu os pés de Jesus. Foi a primeira testemunha da Ressurreição, chamada de apóstola dos apóstolos.",
      draw: () => g("translate(150,246) scale(1.6)", alabaster()) },
    { id: "barnabe", name: "São Barnabé", feast: "11 de junho", hue: 100,
      why: "O ramo de oliveira, sinal da paz e da reconciliação, e o livro do Evangelho. Foi companheiro de Paulo nas viagens missionárias; seu nome quer dizer “filho da consolação”.",
      draw: () => g("translate(140,220) scale(1.15)", olive()) + g("translate(160,306) scale(.8)", openBook(C.blue)) },
    { id: "benedito", name: "São Benedito", feast: "4 de abril (no Brasil, também 5 de outubro)", hue: 36,
      why: "A panela e as flores: era cozinheiro do convento, e os alimentos que levava escondidos para os pobres se transformaram em flores. Filho de africanos escravizados, é muito venerado no Brasil.",
      draw: () => g("translate(150,292) scale(1.15)", pot()) +
        [[118, 236, 1], [150, 222, 1.1], [182, 236, 1], [134, 210, .8], [168, 206, .8]].map(([x, y, s]) => blossom(x, y, s)).join("") +
        g("translate(104,254) scale(.8)", rose()) + g("translate(196,254) scale(.8)", rose()) },
    { id: "longuinho", name: "São Longuinho", feast: "15 de março", hue: 268,
      why: "A lança com que o soldado romano abriu o lado de Cristo na cruz; conta a tradição que o sangue curou a sua vista, por isso o olho. No Brasil, é invocado para achar objetos perdidos.",
      draw: () => g("translate(150,250) scale(.95)", longLance()) + g("translate(116,190) scale(1.2)", eyeRays()) },
    { id: "joaopaulo", name: "São João Paulo II", feast: "22 de outubro", hue: 216,
      why: "O báculo papal com o crucifixo, que levava nas celebrações, e o seu brasão: a cruz e o M de Maria, do lema Totus Tuus (“Todo teu”).",
      draw: () => g("translate(196,236)", ferula()) + g("translate(120,240) scale(1.05)", jp2Shield()) },
    { id: "rafael", name: "São Rafael Arcanjo", feast: "29 de setembro", hue: 186,
      why: "O peixe: guiou o jovem Tobias e o ensinou a usar o fel do peixe para curar a cegueira do pai (Tb 6). As asas são de arcanjo. Seu nome significa “Deus cura”.",
      draw: () => g("translate(132,214) scale(.8)", wing()) + g("translate(168,214) scale(-.8,.8)", wing()) + g("translate(150,270) scale(1.5)", fish()) },
    { id: "josemaria", name: "São Josemaria Escrivá", feast: "26 de junho", hue: 244,
      why: "A cruz dentro do círculo é o selo do Opus Dei, que fundou em 1928 para ensinar que o trabalho e a vida comum são caminho de santidade. A rosa de madeira dourada é a rosa de Rialp, que encontrou em 1937 ao atravessar os Pireneus e tomou como sinal de Deus. O livro é “Caminho”, sua obra mais conhecida.",
      draw: () => g("translate(150,190)", `<circle r="46" fill="${C.white}"/>` + cross(C.dkbrown, 84, 56, 9)) +
        g("translate(106,286) scale(1.5)", pathL("M0,10 Q5,26 0,40", C.dkgreen, 3) + `<circle r="13" fill="${C.gold}"/><path d="M-6,-1 Q0,-9 6,-1 Q4,6 -3,4 Q-2,-1 2,-1" fill="none" stroke-width="2"/>`) +
        g("translate(192,306) scale(.75)", openBook(C.dkbrown)) },
    // Preparados em 10/10/2026: sem desenho de reserva; só aparecem no jogo quando tiverem as duas imagens aprovadas
    { id: "ana", name: "Santa Ana", feast: "26 de julho", hue: 13,
      why: "O livro aberto e a menina Maria: a tradição mostra Ana ensinando a filha a ler as Escrituras. É a mãe de Nossa Senhora e avó de Jesus, padroeira das avós." },
    { id: "monica", name: "Santa Mônica", feast: "27 de agosto", hue: 60,
      why: "O lenço e as lágrimas: chorou e rezou durante anos pela conversão do filho, Santo Agostinho. A correia de couro é a do hábito agostiniano. É padroeira das mães." },
    { id: "veronica", name: "Santa Verônica", feast: "12 de julho", hue: 107,
      why: "O véu com o rosto de Cristo: segundo a tradição, enxugou o rosto de Jesus no caminho do Calvário, e a imagem ficou gravada no pano. É a sexta estação da Via-Sacra." },
    { id: "dulce", name: "Santa Dulce dos Pobres", feast: "13 de agosto", hue: 154,
      why: "A sanfona, que tocava para animar operários e doentes, e os pães que distribuía aos pobres de Salvador. Começou seu hospital num galinheiro do convento. Foi a primeira santa nascida no Brasil." },
    { id: "margaridamaria", name: "Santa Margarida Maria Alacoque", feast: "16 de outubro", hue: 201,
      why: "O Sagrado Coração de Jesus, em chamas, cercado pela coroa de espinhos e com a cruz no alto, como lhe apareceu no convento de Paray-le-Monial. Dela vem a devoção das nove primeiras sextas-feiras." },
    { id: "gabriel", name: "São Gabriel Arcanjo", feast: "29 de setembro", hue: 248,
      why: "As asas de arcanjo, o lírio da Anunciação e o cetro de mensageiro: foi ele quem anunciou a Maria que seria a mãe de Jesus (Lc 1,26). Seu nome significa “Deus é forte”." },
    { id: "reismagos", name: "Santos Reis Magos", feast: "6 de janeiro", hue: 295,
      why: "As três coroas, os presentes de ouro, incenso e mirra e a estrela que os guiou até Belém (Mt 2). A tradição os chama de Gaspar, Melquior e Baltasar; no Brasil são festejados nas Folias de Reis." },
    { id: "joaobosco", name: "São João Bosco", feast: "31 de janeiro", hue: 342,
      why: "O navio ancorado entre duas colunas vem do seu sonho mais famoso: a Igreja, em meio à tempestade, encontra segurança entre a Eucaristia e Nossa Senhora. Fundou os salesianos para educar meninos pobres." },
    { id: "carloacutis", name: "São Carlo Acutis", feast: "12 de outubro", hue: 29,
      why: "O computador, com que montou um site sobre os milagres eucarísticos, a mochila de adolescente e a hóstia: chamava a Eucaristia de “minha autoestrada para o céu”. Morreu aos 15 anos, em 2006." },
    { id: "vicentepaulo", name: "São Vicente de Paulo", feast: "27 de setembro", hue: 76,
      why: "A criança enjeitada e o pão: recolhia os bebês abandonados nas ruas de Paris e organizou a ajuda aos pobres. É o padroeiro das obras de caridade." },
    { id: "marta", name: "Santa Marta", feast: "29 de julho", hue: 123,
      why: "A caldeirinha de água benta com o hissope, com que, segundo a lenda, venceu um dragão na Provença, e a concha de cozinha: foi ela quem serviu Jesus em sua casa, em Betânia (Lc 10,38). É padroeira das donas de casa." },
    { id: "isabel", name: "Santa Isabel da Hungria", feast: "17 de novembro", hue: 170,
      why: "A coroa de princesa, os pães que levava escondidos aos pobres e as rosas em que eles se transformaram quando a surpreenderam. Viúva aos 20 anos, entrou para a Ordem Terceira Franciscana." },
    { id: "catarinasena", name: "Santa Catarina de Sena", feast: "29 de abril", hue: 217,
      why: "O anel do casamento místico com Cristo, o coração que, segundo seu relato, Jesus trocou com o dela, e o lírio sobre o livro de doutora da Igreja. Convenceu o papa a voltar de Avinhão para Roma." },
    { id: "efigenia", name: "Santa Efigênia", feast: "21 de setembro", hue: 264,
      why: "A igreja em chamas na mão: quiseram incendiar o convento que ela fundou, e o fogo se apagou por sua oração. A coroa no chão lembra que era princesa da Etiópia, convertida por São Mateus. É muito venerada nas irmandades negras do Brasil." },
    { id: "paulina", name: "Santa Paulina", feast: "9 de julho", hue: 311,
      why: "O casebre de madeira e o crucifixo: em 1890, em Nova Trento (SC), começou num casebre a cuidar de uma mulher com câncer; dali nasceu a Congregação das Irmãzinhas da Imaculada Conceição. Foi canonizada em 2002." },
    { id: "gianna", name: "Santa Gianna Beretta Molla", feast: "28 de abril", hue: 358,
      why: "O estetoscópio de médica e o berço: pediatra e mãe de família, recusou em 1962 um tratamento que tiraria a vida da filha que esperava, e morreu dias depois do parto. É padroeira das mães e dos médicos." },
    { id: "joaquim", name: "São Joaquim", feast: "26 de julho", hue: 45,
      why: "O cesto com duas pombas, oferta dos pobres no Templo, e o cajado de pastor. É o pai de Nossa Senhora e avô de Jesus, festejado junto com Santa Ana." },
    { id: "luisgonzaga", name: "São Luís Gonzaga", feast: "21 de junho", hue: 92,
      why: "A coroa no chão, porque renunciou ao título de marquês para ser jesuíta; o lírio da pureza e o crucifixo. Morreu aos 23 anos cuidando de doentes da peste em Roma. É padroeiro da juventude." },
    { id: "camilo", name: "São Camilo de Lélis", feast: "14 de julho", hue: 139,
      why: "A cruz vermelha no hábito preto, sinal dos Camilianos, a ordem que fundou para cuidar dos doentes. É padroeiro dos enfermos, dos hospitais e dos profissionais de saúde." },
    { id: "martinholima", name: "São Martinho de Lima", feast: "3 de novembro", hue: 186,
      why: "A vassoura, porque fazia os serviços mais humildes do convento, e o cão, o gato e o rato comendo no mesmo prato, sinal da paz que criava ao redor. Irmão dominicano em Lima, filho de uma negra liberta, é padroeiro da justiça social." },
    { id: "raimundononato", name: "São Raimundo Nonato", feast: "31 de agosto", hue: 233,
      why: "O cadeado: preso na África por resgatar cativos, teve os lábios trancados para não pregar. A palma com três coroas representa castidade, pregação e martírio. É padroeiro das parteiras e das grávidas." },
    { id: "vianney", name: "São João Maria Vianney", feast: "4 de agosto", hue: 280,
      why: "A estola roxa e o confessionário: o Cura d’Ars passava até 16 horas por dia atendendo confissões. É o padroeiro dos párocos." },
    { id: "tarcisio", name: "São Tarcísio", feast: "15 de agosto", hue: 327,
      why: "A teca com a Eucaristia apertada contra o peito: menino da Roma do século III, foi morto ao proteger as hóstias que levava aos presos. É padroeiro dos coroinhas." },
    { id: "joaodiego", name: "São Juan Diego", feast: "9 de dezembro", hue: 14,
      why: "O manto (tilma) com a imagem de Nossa Senhora de Guadalupe e as rosas que caíram dele diante do bispo, no México, em 1531. É o primeiro santo indígena das Américas." },
    { id: "simaostock", name: "São Simão Stock", feast: "16 de maio", hue: 61,
      why: "O escapulário marrom que, segundo a tradição carmelita, recebeu de Nossa Senhora do Carmo em 1251. É uma das devoções mais difundidas no Brasil." },
    { id: "dimas", name: "São Dimas", feast: "25 de março", hue: 108,
      why: "A cruz com cordas: é o bom ladrão crucificado ao lado de Jesus, a quem pediu “lembra-te de mim” e ouviu “hoje estarás comigo no Paraíso” (Lc 23,43)." },
    { id: "onofre", name: "Santo Onofre", feast: "12 de junho", hue: 155,
      why: "A veste de folhas do eremita que viveu décadas no deserto do Egito, e a coroa e o cetro no chão: a tradição diz que era filho de rei. No Brasil é invocado para que nunca falte o pão." },
    { id: "tomasaquino", name: "São Tomás de Aquino", feast: "28 de janeiro", hue: 202,
      why: "O sol de ouro no peito, sinal da sabedoria que ilumina, a pena e os livros da Suma Teológica. Frade dominicano, é doutor da Igreja e padroeiro dos estudantes." },
    { id: "carlosborromeu", name: "São Carlos Borromeu", feast: "4 de novembro", hue: 296,
      why: "A corda de penitente no pescoço, com que saiu descalço em procissão durante a peste de Milão, o crucifixo e o barrete vermelho de cardeal." },
    { id: "brigida", name: "Santa Brígida da Irlanda", feast: "1º de fevereiro", hue: 343,
      why: "A cruz de junco trançado, que fez para explicar a fé a um moribundo, a vaca, porque distribuía leite e manteiga aos pobres, e a chama que as monjas de Kildare mantinham acesa. É padroeira da Irlanda." },
    { id: "escolastica", name: "Santa Escolástica", feast: "10 de fevereiro", hue: 30,
      why: "A pomba, forma em que São Bento viu a alma da irmã subir ao céu, o báculo de abadessa e a nuvem de chuva: ela rezou, e a tempestade impediu o irmão de ir embora." },
    { id: "doroteia", name: "Santa Doroteia", feast: "6 de fevereiro", hue: 77,
      why: "O cesto com maçãs e rosas: a caminho do martírio, zombaram dela pedindo frutas do paraíso, e em pleno inverno um menino entregou o cesto ao zombador." },
    { id: "edithstein", name: "Santa Teresa Benedita da Cruz (Edith Stein)", feast: "9 de agosto", hue: 124,
      why: "A estrela de Davi amarela, porque nasceu judia e foi morta em Auschwitz em 1942; a cruz do nome que escolheu como carmelita; e o arame farpado do campo. Filósofa, é copadroeira da Europa." },
    { id: "filipe", name: "São Filipe", feast: "3 de maio", hue: 171,
      why: "A cruz alta do martírio e os pães: foi a ele que Jesus perguntou onde comprar pão para a multidão, antes de multiplicar os pães (Jo 6,5)." },
    { id: "tiagomenor", name: "São Tiago Menor", feast: "3 de maio", hue: 218,
      why: "O maço de pisoeiro, bastão com que foi morto em Jerusalém, e o livro da carta que leva seu nome. É chamado “Menor” para se distinguir do outro apóstolo Tiago." },
    { id: "joaodedeus", name: "São João de Deus", feast: "8 de março", hue: 265,
      why: "A romã com uma cruz, emblema de Granada, cidade onde fundou seu hospital, e o cesto com que pedia esmolas para os doentes. É padroeiro dos hospitais e dos enfermeiros." },
    { id: "januario", name: "São Januário", feast: "19 de setembro", hue: 312,
      why: "As duas ampolas com seu sangue, guardadas na catedral de Nápoles, onde o sangue seco se liquefaz em datas do ano. Bispo de Benevento, foi martirizado em 305." },
    { id: "bonifacio", name: "São Bonifácio", feast: "5 de junho", hue: 359,
      why: "O livro atravessado pela espada, com que tentou se proteger ao ser morto, e o carvalho cortado: derrubou a árvore consagrada a Thor para mostrar que nada aconteceria. É o apóstolo da Alemanha." },
    { id: "nepomuceno", name: "São João Nepomuceno", feast: "16 de maio", hue: 46,
      why: "A ponte de Praga, de onde foi lançado ao rio em 1393 por não revelar ao rei um segredo de confissão, e as cinco estrelas que, segundo a tradição, brilharam sobre a água." },
    { id: "frassati", name: "São Pier Giorgio Frassati", feast: "4 de julho", hue: 93,
      why: "O piolet, a corda e a montanha: alpinista, escreveu numa foto de escalada “Verso l’alto”, para o alto. Estudante de Turim, gastava o que tinha com os pobres e morreu aos 24 anos, em 1925." },
    { id: "charbel", name: "São Charbel", feast: "24 de julho", hue: 140,
      why: "A lamparina e o capuz preto: monge maronita do Líbano, viveu 23 anos como eremita. Conta-se que sua lamparina, cheia de água por brincadeira, acendeu assim mesmo." },
    { id: "cupertino", name: "São José de Cupertino", feast: "18 de setembro", hue: 187,
      why: "As sandálias no ar: são muitos os relatos de que se elevava do chão em oração. Como teve grande dificuldade nos estudos, é padroeiro dos estudantes em prova e dos aviadores." },
    { id: "foucauld", name: "São Charles de Foucauld", feast: "1º de dezembro", hue: 234,
      why: "O coração vermelho com a cruz, que costurou na túnica branca, e as dunas do Saara, onde viveu entre os tuaregues. Foi canonizado em 2022." },
    { id: "joaodacruz", name: "São João da Cruz", feast: "14 de dezembro", hue: 281,
      why: "A cruz rústica do nome que escolheu, e o monte sob a noite estrelada, imagens de seus poemas “Noite Escura” e “Subida do Monte Carmelo”. Reformou o Carmelo com Santa Teresa d’Ávila." },
    { id: "inacioantioquia", name: "Santo Inácio de Antioquia", feast: "17 de outubro", hue: 328,
      why: "Os dois leões: bispo de Antioquia, foi levado a Roma e entregue às feras por volta do ano 107. No caminho escreveu: “sou trigo de Deus, moído pelos dentes das feras”." },
    { id: "tomasbecket", name: "São Tomás Becket", feast: "29 de dezembro", hue: 15,
      why: "A mitra partida por uma espada: arcebispo de Cantuária, foi morto na própria catedral em 1170 por cavaleiros do rei Henrique II." },
    { id: "brandao", name: "São Brandão", feast: "16 de maio", hue: 62,
      why: "O barco sobre a baleia: a lenda da sua viagem pelo Atlântico conta que os monges celebraram a Páscoa no dorso de uma baleia, pensando que fosse uma ilha. É padroeiro dos navegantes." },
    { id: "amaro", name: "Santo Amaro", feast: "15 de janeiro", hue: 109,
      why: "A muleta, o báculo de abade e o livro da Regra: discípulo de São Bento, é invocado nas doenças dos ossos e das articulações. Dá nome a muitas cidades e bairros do Brasil." },
    { id: "ivo", name: "Santo Ivo", feast: "19 de maio", hue: 156,
      why: "O rolo de pergaminho com selo e o tinteiro: juiz e advogado na Bretanha do século XIII, defendia os pobres sem cobrar. É padroeiro dos advogados e dos juízes." },
    // Lista do Daniel de 11/10/2026: também sem desenho de reserva
    { id: "ines", name: "Santa Inês", feast: "21 de janeiro", hue: 29,
      why: "O cordeiro, por sua pureza e porque seu nome lembra a palavra latina agnus (cordeiro); a palma e a espada do martírio. Menina romana de 12 ou 13 anos, foi morta por volta do ano 304. No dia de sua festa são bentos os cordeiros cuja lã serve para tecer os pálios dos arcebispos." },
    { id: "pastorinhos", name: "Santos Francisco e Jacinta Marto", feast: "20 de fevereiro", hue: 76,
      why: "O terço, que Nossa Senhora lhes pediu que rezassem todos os dias; as ovelhas que pastoreavam e a azinheira sobre a qual ela apareceu, em Fátima, Portugal, em 1917. Morreram crianças, na epidemia de gripe: Francisco em 1919, com 10 anos, e Jacinta em 1920, com 9." },
    { id: "tome", name: "São Tomé", feast: "3 de julho", hue: 123,
      why: "O esquadro de construtor: a tradição conta que foi à Índia e lá trabalhou como arquiteto de um rei. A lança é a do martírio. É o apóstolo que só acreditou na ressurreição depois de ver as chagas de Jesus (Jo 20,24-29)." },
    { id: "tomasmore", name: "São Tomás More", feast: "22 de junho", hue: 170,
      why: "O colar de ouro de chanceler da Inglaterra, o cargo mais alto do reino, e o machado do carrasco: foi decapitado em 1535 por não reconhecer o rei Henrique VIII como chefe da Igreja. É padroeiro dos políticos e governantes." },
    { id: "boaventura", name: "São Boaventura", feast: "15 de julho", hue: 217,
      why: "O chapéu vermelho de cardeal pendurado num galho: conta-se que, quando o trouxeram, ele lavava a louça do convento e pediu que o deixassem numa árvore até terminar. O cordão de três nós é o dos franciscanos, de quem foi superior geral; a pena é a de doutor da Igreja." },
    { id: "bruno", name: "São Bruno", feast: "6 de outubro", hue: 264,
      why: "O dedo nos lábios, sinal do silêncio dos cartuxos, a ordem que fundou em 1084 nas montanhas da França; a caveira da meditação e a mitra no chão, porque recusou ser bispo. As sete estrelas lembram os sete primeiros companheiros." },
    { id: "filipeneri", name: "São Filipe Neri", feast: "26 de maio", hue: 311,
      why: "O coração em chamas: conta-se que, numa noite de oração nas catacumbas, um globo de fogo entrou em seu peito e lhe dilatou o coração. A casula vermelha é a da missa; o lírio, o da pureza. Chamado “o santo da alegria”, fundou a Congregação do Oratório." },
    { id: "franciscopaula", name: "São Francisco de Paula", feast: "2 de abril", hue: 358,
      why: "O sol radiante com a palavra CHARITAS (caridade), lema da Ordem dos Mínimos, que ele fundou; o cajado de eremita e o manto: conta-se que atravessou o estreito de Messina navegando sobre o próprio manto. Morreu na França em 1507, aos 91 anos." },
    { id: "germano", name: "São Germano de Paris", feast: "28 de maio", hue: 45,
      why: "As correntes abertas e as moedas do resgate: bispo de Paris no século VI, era chamado “pai dos pobres” e empenhava-se em libertar presos e escravos. Está sepultado na abadia que ganhou seu nome, Saint-Germain-des-Prés." },
    { id: "ezequielmoreno", name: "Santo Ezequiel Moreno", feast: "19 de agosto", hue: 92,
      why: "A cruz de bispo no peito, o solidéu roxo e a correia de couro dos agostinianos recoletos. Missionário nas Filipinas e bispo de Pasto, na Colômbia, morreu em 1906 e é invocado pelos doentes de câncer." },
    { id: "tomasvilanova", name: "Santo Tomás de Vilanova", feast: "8 de setembro (entre os agostinianos, 10 de outubro)", hue: 139,
      why: "A mitra de arcebispo e a bolsa de moedas despejada na tigela de um mendigo: arcebispo de Valência, na Espanha, era famoso pelo cuidado com os pobres da cidade. Era frade agostiniano e morreu em 1555." },
    { id: "joaosahagun", name: "São João de Sahagún", feast: "12 de junho", hue: 186,
      why: "O cálice com a hóstia brilhando: conta-se que via Cristo na hóstia enquanto celebrava a missa. O ramo de oliveira lembra a paz que conseguiu entre as famílias nobres de Salamanca, na Espanha, que viviam em guerra. Era frade agostiniano." },
    { id: "nicolautolentino", name: "São Nicolau de Tolentino", feast: "10 de setembro", hue: 233,
      why: "A estrela no peito, que segundo a tradição o acompanhava no caminho da igreja; o lírio da pureza e o cesto de pãezinhos, os “pães de São Nicolau”, que ele abençoava para os doentes. Frade agostiniano italiano, é invocado pelas almas do purgatório." },
    { id: "madalenanagasaki", name: "Santa Madalena de Nagasaki", feast: "28 de setembro (entre os agostinianos recoletos, 20 de outubro)", hue: 280,
      why: "A palma do martírio e a roupa japonesa com a correia preta dos agostinianos. Jovem japonesa, foi intérprete e catequista dos missionários, por isso o livro, e morreu mártir em Nagasaki, em 1634, com pouco mais de 20 anos." },
    { id: "simao", name: "São Simão", feast: "28 de outubro", hue: 327,
      why: "A serra: segundo a tradição, foi martirizado serrado ao meio, na Pérsia. O livro é o do Evangelho que pregou. Chamado “o Zelote”, é festejado no mesmo dia que São Judas Tadeu." },
    { id: "matias", name: "São Matias", feast: "14 de maio", hue: 14,
      why: "As duas pedrinhas lembram o sorteio que o escolheu para o lugar de Judas Iscariotes (At 1,26); a alabarda é a do martírio que a tradição lhe atribui." },
    // Lista aprovada pelo Daniel em 12/10/2026: também sem desenho de reserva
    { id: "valentim", name: "São Valentim", feast: "14 de fevereiro", hue: 71,
      why: "O coração vermelho e as rosas lembram o Dia dos Namorados, celebrado em muitos países no dia de sua festa; a palma é a do martírio. Segundo a tradição, era um sacerdote de Roma que casava os casais cristãos às escondidas." },
    { id: "silvestre", name: "São Silvestre", feast: "31 de dezembro", hue: 118,
      why: "A tiara de papa e o touro: a lenda conta que ele ressuscitou um touro diante de sábios que duvidavam da fé. Foi papa quando o imperador Constantino deu liberdade aos cristãos. Sua festa, no último dia do ano, dá nome à corrida de São Paulo." },
    { id: "pancracio", name: "São Pancrácio", feast: "12 de maio", hue: 165,
      why: "A palma e a espada do martírio: foi decapitado em Roma por volta de 304, quando tinha só 14 anos. As moedas lembram que é invocado por quem procura emprego e pelo sustento da família." },
    { id: "geraldo", name: "São Geraldo Majela", feast: "16 de outubro", hue: 212,
      why: "O crucifixo, o lírio e o lenço branco: conta-se que deixou cair seu lenço e disse à moça que o apanhou que ficasse com ele. Anos depois, ela o usou num parto perigoso e foi salva. Por isso é o padroeiro das gestantes e das mães." },
    { id: "catarinalaboure", name: "Santa Catarina Labouré", feast: "28 de novembro", hue: 259,
      why: "A Medalha Milagrosa: em 1830, numa capela de Paris, viu Nossa Senhora de pé sobre o globo, com raios de luz saindo das mãos, e recebeu o pedido de mandar cunhar uma medalha com essa imagem. A grande touca branca é a das Filhas da Caridade." },
    { id: "joaoxxiii", name: "São João XXIII", feast: "11 de outubro", hue: 306,
      why: "O solidéu branco, o anel de papa e o livro aberto do Concílio Vaticano II, que ele convocou e abriu em 11 de outubro de 1962, data que virou sua festa. Pelo jeito simples e bem-humorado, o povo o chamava de “o papa bom”." },
    { id: "domingossavio", name: "São Domingos Sávio", feast: "6 de maio", hue: 353,
      why: "O lírio e o lema que escolheu na primeira comunhão, aos 7 anos: “antes morrer que pecar”. O livro de escola lembra que era aluno de São João Bosco, em Turim, e o terço, a devoção a Nossa Senhora que ele espalhava entre os colegas." },
    { id: "mariagoretti", name: "Santa Maria Goretti", feast: "6 de julho", hue: 40,
      why: "Os lírios da pureza e a palma do martírio: aos 11 anos, resistiu a um rapaz que tentou forçá-la ao pecado e foi ferida de morte, em 1902, perto de Roma. Antes de morrer, perdoou o agressor, que mais tarde se converteu." },
    { id: "lazaro", name: "São Lázaro", feast: "29 de julho", hue: 87,
      why: "O túmulo aberto e as faixas de linho: Jesus o ressuscitou em Betânia depois de quatro dias morto, chamando: “Lázaro, vem para fora!” (Jo 11,43). É irmão de Marta e de Maria e festejado no mesmo dia que elas." },
    { id: "piox", name: "São Pio X", feast: "21 de agosto", hue: 134,
      why: "A hóstia e a menina de primeira comunhão: permitiu que as crianças comungassem a partir dos 7 anos e incentivou a comunhão frequente. Filho de um carteiro, deixou escrito que nasceu pobre, viveu pobre e queria morrer pobre." },
    { id: "luisrei", name: "São Luís, Rei da França", feast: "25 de agosto", hue: 181,
      why: "A coroa de rei e a coroa de espinhos de Cristo: comprou essa relíquia em 1239 e construiu para guardá-la a Sainte-Chapelle, em Paris. Rei da França por 44 anos, morreu em 1270, durante uma cruzada, em Túnis." },
    { id: "paulovi", name: "São Paulo VI", feast: "29 de maio", hue: 228,
      why: "O bastão de prata com o crucifixo, que mandou fazer e que os papas usam até hoje, e o globo: foi o primeiro papa a viajar de avião e visitou os cinco continentes. Concluiu o Concílio Vaticano II, em 1965." },
    { id: "franciscosales", name: "São Francisco de Sales", feast: "24 de janeiro", hue: 275,
      why: "A pena e as folhas de papel: para alcançar os calvinistas da região de Chablais, que se recusavam a ouvi-lo, escrevia folhetos e os passava por baixo das portas. Por isso é o padroeiro dos jornalistas e escritores. A mitra é a de bispo de Genebra." },
    { id: "afonso", name: "Santo Afonso de Ligório", feast: "1º de agosto", hue: 322,
      why: "O cravo: além de bispo e escritor, era músico e compôs “Tu scendi dalle stelle”, a canção de Natal mais conhecida da Itália. O quadro de Nossa Senhora lembra seu livro “As glórias de Maria”. Fundou os redentoristas em 1732." },
    { id: "bernardo", name: "São Bernardo de Claraval", feast: "20 de agosto", hue: 9,
      why: "O cão branco lembra o sonho de sua mãe antes de seu nascimento: um cachorrinho branco que latia, sinal de que o filho defenderia a Igreja com a palavra. O báculo é o de abade, e o hábito branco, o dos monges cistercienses." },
    { id: "crisostomo", name: "São João Crisóstomo", feast: "13 de setembro", hue: 56,
      why: "O Evangelho de capa dourada: “Crisóstomo” quer dizer “boca de ouro”, apelido que ganhou pelos sermões. O turíbulo lembra a liturgia que leva seu nome, celebrada até hoje pelas Igrejas do Oriente, e a estola branca com cruzes, os bispos orientais." },
    { id: "dionisio", name: "São Dionísio", feast: "9 de outubro", hue: 103,
      why: "A colina com a capela é Montmartre, o “monte dos mártires”, em Paris, onde foi decapitado; a lenda diz que se levantou e caminhou levando a própria cabeça. A mitra é a de primeiro bispo de Paris, e a espada e a palma, as do martírio." },
    { id: "ursula", name: "Santa Úrsula", feast: "21 de outubro", hue: 150,
      why: "A flecha, o navio e a coroa: segundo a lenda, era uma princesa que voltava de uma peregrinação a Roma com muitas companheiras, e todas foram mortas pelos hunos em Colônia, na Alemanha; Úrsula, com uma flecha." },
    { id: "genoveva", name: "Santa Genoveva", feast: "3 de janeiro", hue: 197,
      why: "A vela acesa e o anjo: conta-se que, quando ia rezar à noite, o demônio apagava sua vela e um anjo a acendia de novo. O livro é o das orações que rezava. É padroeira de Paris e morreu por volta do ano 500." },
    { id: "damiao", name: "São Damião de Molokai", feast: "10 de maio", hue: 244,
      why: "O chapéu de palha, a bengala e os curativos: viveu 16 anos na ilha de Molokai, no Havaí, com os doentes de hanseníase que o governo isolava ali, tratando suas feridas, construindo casas e enterrando os mortos. Contraiu a doença e morreu em 1889." },
    { id: "pedroclaver", name: "São Pedro Claver", feast: "9 de setembro", hue: 291,
      why: "O jarro d’água e o cesto de frutas: em Cartagena, na Colômbia, esperava no porto os navios negreiros para levar água, comida e remédio aos africanos escravizados. Assinou seus votos como “escravo dos escravos para sempre”." },
    { id: "romero", name: "Santo Óscar Romero", feast: "24 de março", hue: 338,
      why: "A casula vermelha, o cálice e a palma: foi morto com um tiro em 1980, enquanto celebrava a missa numa capela de hospital em San Salvador. Arcebispo da cidade, defendia os pobres e denunciava a violência da guerra civil de El Salvador." },
    { id: "zita", name: "Santa Zita", feast: "27 de abril", hue: 25,
      why: "O molho de chaves e o cesto de pão: foi empregada doméstica da mesma família, em Luca, na Itália, por 48 anos, e dava aos pobres parte da comida. Conta-se que, quando o patrão a surpreendeu, o pão no avental tinha virado flores. É padroeira das empregadas domésticas." },
    { id: "peregrino", name: "São Peregrino", feast: "1º de maio (entre os servitas, 4 de maio)", hue: 72,
      why: "O crucifixo e a muleta: frade servita, teve uma ferida de câncer na perna e a amputação foi marcada. Na véspera, rezou diante do crucifixo e, segundo a tradição, amanheceu curado. É o padroeiro dos doentes de câncer." },
    { id: "luiszelia", name: "Santos Luís e Zélia Martin", feast: "12 de julho", hue: 119,
      why: "O relógio de bolso e a renda: Luís era relojoeiro e Zélia dirigia uma oficina da famosa renda de Alençon, na França. As alianças lembram que foram o primeiro casal canonizado junto, em 2015. Entre seus nove filhos está Santa Teresinha." },
    { id: "luisamarillac", name: "Santa Luísa de Marillac", feast: "15 de março (na Família Vicentina, 9 de maio)", hue: 166,
      why: "A panela de sopa e a tigela: com São Vicente de Paulo, fundou em 1633 as Filhas da Caridade, as primeiras religiosas que não viviam em clausura e saíam às ruas para cuidar dos pobres e dos doentes. É padroeira dos assistentes sociais." },
    { id: "pedroalcantara", name: "São Pedro de Alcântara", feast: "19 de outubro", hue: 213,
      why: "A cruz e o hábito remendado: frade franciscano espanhol, ficou conhecido pela penitência; andava descalço e dormia sentado. Foi declarado padroeiro do Brasil no tempo do Império, e os imperadores Pedro I e Pedro II levavam seu nome." },
    { id: "cunhau", name: "Santos Mártires de Cunhaú e Uruaçu", feast: "3 de outubro", hue: 260,
      why: "A capela, o cálice e as palmas: em 1645, no Rio Grande do Norte, católicos foram mortos por soldados holandeses e indígenas aliados deles, uns durante a missa na capela do engenho de Cunhaú, outros em Uruaçu. O padre André de Soveral celebrava a missa e morreu ali." },
    { id: "margaridaantioquia", name: "Santa Margarida de Antioquia", feast: "20 de julho", hue: 307,
      why: "O dragão sob os pés e a cruz: segundo a lenda, o demônio apareceu na prisão em forma de dragão e a engoliu, mas ela saiu ilesa pelo poder da cruz que segurava. As pérolas lembram seu nome, que quer dizer pérola." },
    { id: "paulomiki", name: "São Paulo Miki", feast: "6 de fevereiro", hue: 354,
      why: "A cruz e as lanças: foi crucificado em Nagasaki em 1597, com 25 companheiros, e pregou do alto da cruz, perdoando os carrascos, até ser morto com golpes de lança. Era um jesuíta japonês." },
    { id: "gil", name: "São Gil", feast: "1º de setembro", hue: 41,
      why: "A corça e a flecha: segundo a lenda, vivia como eremita numa floresta da Provença, na França, alimentado pelo leite de uma corça. Quando o rei saiu à caça, a flecha atingiu a mão de Gil, que protegia o animal. É padroeiro dos deficientes físicos." },
    { id: "vito", name: "São Vito", feast: "15 de junho", hue: 88,
      why: "O caldeirão, de onde saiu ileso segundo a lenda, e os dois cães. Por causa das danças diante de suas imagens na Idade Média, a doença que faz o corpo se mexer sem querer ganhou o nome de “dança de São Vito”." },
    { id: "roquegonzalez", name: "São Roque González", feast: "17 de novembro", hue: 135,
      why: "O sino e a machadinha: em 1628, no Caaró, hoje Rio Grande do Sul, foi morto a golpes enquanto se abaixava para prender o sino da nova redução. Jesuíta nascido no Paraguai, fundou várias reduções com os guaranis." },
    { id: "kateri", name: "Santa Kateri Tekakwitha", feast: "14 de julho", hue: 182,
      why: "O crucifixo e o lírio: chamada “o lírio dos moicanos”, foi a primeira santa indígena da América do Norte. A tartaruga é o símbolo do clã do pai, e as marcas no rosto são da varíola, que a deixou com a vista fraca aos 4 anos." },
    { id: "junipero", name: "São Junípero Serra", feast: "1º de julho", hue: 229,
      why: "A igreja de missão e a cruz: frade franciscano espanhol, fundou as nove primeiras missões da Califórnia, que deram origem a cidades como San Diego e San Francisco. Mesmo com uma perna ferida, percorreu milhares de quilômetros a pé." },
    { id: "fiacre", name: "São Fiacre", feast: "30 de agosto", hue: 276,
      why: "A pá e a horta: eremita irlandês na França, cultivava legumes para alimentar os pobres e os peregrinos, e é padroeiro dos jardineiros. As carruagens de aluguel de Paris ganharam o nome de “fiacres” porque o primeiro ponto ficava junto a uma hospedaria com a sua imagem." },
    { id: "venceslau", name: "São Venceslau", feast: "28 de setembro", hue: 323,
      why: "A lança com a bandeirola da águia e o gorro de duque: duque da Boêmia, foi assassinado pelo próprio irmão em 935, a caminho da missa. É o padroeiro da República Tcheca e o “bom rei Venceslau” de uma canção de Natal inglesa." },
    { id: "clemente", name: "São Clemente", feast: "23 de novembro", hue: 10,
      why: "A âncora e o mar: segundo a tradição, foi exilado na Crimeia e jogado ao mar com uma âncora amarrada ao pescoço. Papa no fim do século I, escreveu uma carta aos coríntios que é um dos textos cristãos mais antigos fora do Novo Testamento." },
    { id: "perpetua", name: "Santas Perpétua e Felicidade", feast: "7 de março", hue: 57,
      why: "A escada e a vaca brava: em Cartago, no ano 203, foram lançadas a uma vaca furiosa na arena. Perpétua tinha visto em sonho uma escada de bronze que levava ao céu. Felicidade era sua escrava e tinha dado à luz poucos dias antes." },
    { id: "basilio", name: "São Basílio Magno", feast: "2 de janeiro", hue: 104,
      why: "O livro e o abrigo: escreveu a regra que os monges do Oriente seguem até hoje. Bispo de Cesareia, na Capadócia, construiu fora da cidade um complexo de abrigo para pobres e doentes, a “Basilíada”. O pão lembra a comida que distribuiu na grande fome de 368." },
    { id: "leao", name: "São Leão Magno", feast: "10 de novembro", hue: 151,
      why: "A tiara e as duas espadas: em 452, saiu de Roma para encontrar Átila, rei dos hunos, que desistiu de atacar a cidade. A tradição conta que São Pedro e São Paulo apareceram no céu, de espada na mão, por trás do papa." },
    { id: "anselmo", name: "Santo Anselmo", feast: "21 de abril", hue: 198,
      why: "O navio, o livro e a mitra: atravessou o mar para ser arcebispo da Cantuária, na Inglaterra, e foi exilado duas vezes por defender a liberdade da Igreja diante dos reis. O livro lembra o filósofo da “fé que busca entender”." },
    { id: "beda", name: "São Beda", feast: "25 de maio", hue: 245,
      why: "A pena e a pilha de livros: monge na Inglaterra, escreveu a primeira história do povo inglês e popularizou a contagem dos anos a partir do nascimento de Cristo. É chamado “o Venerável”." },
    { id: "norberto", name: "São Norberto", feast: "6 de junho", hue: 292,
      why: "O ostensório e o cálice com a aranha: defendeu a fé na Eucaristia, e a lenda conta que bebeu o vinho consagrado mesmo depois de uma aranha venenosa cair nele, e nada lhe aconteceu. O hábito branco é o dos premonstratenses, que fundou." },
    { id: "kostka", name: "Santo Estanislau Kostka", feast: "13 de novembro", hue: 339,
      why: "Os anjos com a hóstia: doente numa casa protestante, onde não podia receber a comunhão, contou que dois anjos a trouxeram para ele. O lírio lembra a juventude: morreu noviço jesuíta, aos 17 anos." },
    { id: "angelamerici", name: "Santa Ângela Merici", feast: "27 de janeiro", hue: 26,
      why: "O manto aberto sobre as meninas: fundou em 1535, em Bréscia, na Itália, a Companhia de Santa Úrsula, a primeira ordem feminina dedicada a ensinar meninas. O livro é o da instrução que elas recebiam." },
    { id: "lwanga", name: "São Carlos Lwanga", feast: "3 de junho", hue: 73,
      why: "A esteira de junco, o fogo e a palma: em 1886, em Namugongo, foi morto na fogueira, enrolado numa esteira, com outros jovens cristãos da corte do rei de Buganda, hoje Uganda, por não abandonarem a fé. Era chefe dos pajens do rei e protegia os rapazes sob seus cuidados." },
    { id: "cirilometodio", name: "Santos Cirilo e Metódio", feast: "14 de fevereiro", hue: 120,
      why: "A igrejinha e o livro: irmãos gregos de Tessalônica, foram missionários entre os eslavos da Morávia no século IX. Criaram um alfabeto para escrever a língua deles e traduziram a Bíblia e a liturgia. São padroeiros da Europa." },
    { id: "solano", name: "São Francisco Solano", feast: "14 de julho", hue: 167,
      why: "O violino: frade franciscano espanhol, missionário no Peru e na Argentina, tocava violino para os indígenas e os atraía com a música para ouvir o Evangelho. O crucifixo é o que levava pendurado ao peito nas viagens." },
    { id: "mariaegipciaca", name: "Santa Maria Egipcíaca", feast: "1º de abril", hue: 214,
      why: "Os três pães: comprou-os antes de atravessar o rio Jordão e, segundo a tradição, viveu deles por muitos anos no deserto. Os longos cabelos a cobrem porque suas roupas se desfizeram com o tempo." },
    // Lista aprovada pelo Daniel em 13/10/2026, que completa os 200: também sem desenho de reserva
    { id: "anjodaguarda", name: "Santo Anjo da Guarda", feast: "2 de outubro", hue: 29,

    { id: "zacariasisabel", name: "Santos Zacarias e Isabel", feast: "23 de junho", hue: 76,

    { id: "agueda", name: "Santa Águeda", feast: "5 de fevereiro", hue: 123,

    { id: "floriano", name: "São Floriano", feast: "4 de maio", hue: 170,

    { id: "lasalle", name: "São João Batista de La Salle", feast: "7 de abril", hue: 217,

    { id: "champagnat", name: "São Marcelino Champagnat", feast: "6 de junho", hue: 264,

    { id: "aleixo", name: "Santo Aleixo", feast: "17 de julho", hue: 311,
      why: "A escada e a carta: segundo a lenda, deixou a casa rica dos pais, em Roma, no dia do casamento, e viveu anos como mendigo no Oriente. De volta, sem ser reconhecido, morou dezessete anos debaixo da escada da casa do pai. Só foi identificado depois de morto, pela carta que tinha na mão." },
    { id: "hildegarda", name: "Santa Hildegarda de Bingen", feast: "17 de setembro", hue: 358,
      why: "As línguas de fogo e o livro: desde criança tinha visões, que descreveu como uma luz de fogo vinda do céu e pôs por escrito no livro “Scivias”. As ervas lembram seus tratados de medicina e de plantas, e o saltério, as mais de setenta músicas que compôs. É doutora da Igreja desde 2012." },
    { id: "cabrini", name: "Santa Francisca Xavier Cabrini", feast: "22 de dezembro", hue: 45,
      why: "O barquinho de papel com violetas: em criança, soltava num riacho barquinhos de papel cheios de violetas, que chamava de missionárias. Queria ir para a China, mas o papa Leão XIII a mandou “não ao Oriente, mas ao Ocidente”. Atravessou o oceano mais de vinte vezes para cuidar dos imigrantes e é padroeira dos migrantes." },
    { id: "dimpna", name: "Santa Dimpna", feast: "15 de maio", hue: 92,
      why: "A lamparina e a corrente: é a padroeira das pessoas com doenças mentais e de quem cuida delas. Segundo a lenda, era filha de um rei pagão da Irlanda, fugiu para Geel, na Bélgica, e ali foi morta pelo próprio pai, enlouquecido pela morte da esposa. A coroa lembra que era princesa." },
    { id: "albertomagno", name: "Santo Alberto Magno", feast: "15 de novembro", hue: 139,
      why: "O frasco de vidro, a planta e o cristal: estudou e descreveu plantas, animais e minerais, e por isso é o padroeiro dos cientistas. Bispo e frade dominicano, foi professor de São Tomás de Aquino e é doutor da Igreja." },
    { id: "nuno", name: "São Nuno de Santa Maria", feast: "6 de novembro", hue: 186,
      why: "O hábito de carmelita sobre a armadura e a espada deixada no chão: Nuno Álvares Pereira, condestável de Portugal, venceu a batalha de Aljubarrota em 1385. Viúvo, repartiu seus bens e entrou como simples irmão no Convento do Carmo, que tinha mandado construir em Lisboa." },
    { id: "joaodebrito", name: "São João de Brito", feast: "4 de fevereiro", hue: 233,
      why: "A túnica cor de açafrão e o turbante: jesuíta português, viveu no sul da Índia como os mestres religiosos do lugar, vestido como eles, sem comer carne e andando a pé com um cajado de bambu. Foi decapitado em Oriyur, em 1693." },
    { id: "erasmo", name: "Santo Erasmo", feast: "2 de junho", hue: 280,
      why: "O sarilho com a corda enrolada: é o guincho com que os marinheiros puxam a âncora, e fez dele o padroeiro dos navegantes. As luzes azuladas que aparecem nos mastros durante as tempestades são chamadas de “fogo de santelmo” por causa dele, que também é conhecido como Santelmo." },
    { id: "raimundopenaforte", name: "São Raimundo de Penaforte", feast: "7 de janeiro", hue: 327,
      why: "A capa que serve de barco: conta-se que, impedido pelo rei de deixar a ilha de Maiorca, estendeu a capa sobre o mar, prendeu uma ponta ao cajado como vela e navegou assim até Barcelona. O livro lembra o grande jurista, que organizou as leis da Igreja a pedido do papa Gregório IX." },
    { id: "borja", name: "São Francisco de Borja", feast: "3 de outubro", hue: 14,
